name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check types
        run: pnpm check-types

      - name: Run desktop tests
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit:desktop

  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm run make --filter @pg-compass/desktop

      - name: Smoke test packaged app
        run: pnpm --filter @pg-compass/desktop test:e2e:smoke

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pg-compass-windows
          path: apps/desktop/out/make/**/*
          if-no-files-found: error

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm run make --filter @pg-compass/desktop

      - name: Smoke test packaged app
        run: xvfb-run --auto-servernum pnpm --filter @pg-compass/desktop test:e2e:smoke

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pg-compass-linux
          path: apps/desktop/out/make/**/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: pg-compass-windows
          path: artifacts/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: pg-compass-linux
          path: artifacts/linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          # RELEASES and the .nupkg are what Squirrel downloads for in-place
          # updates (update.electronjs.org serves them from this release).
          files: |
            artifacts/windows/squirrel.windows/x64/*.exe
            artifacts/windows/squirrel.windows/x64/*.nupkg
            artifacts/windows/squirrel.windows/x64/RELEASES
            artifacts/linux/deb/x64/*.deb
            artifacts/linux/AppImage/x64/*.AppImage
