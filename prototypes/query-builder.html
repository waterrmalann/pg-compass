      <span class="st-meta"></span>
      <div class="st-actions">
        <button class="ibtn xs" data-act="stage-sql" aria-pressed="${!!st.showSql}" title="Show this stage's SQL" aria-label="Show this stage's SQL">${icon('code')}</button>
        <button class="ibtn xs" data-act="stage-toggle" aria-pressed="${!st.enabled}" title="${st.enabled ? 'Skip stage' : 'Include stage'}" aria-label="${st.enabled ? 'Skip stage' : 'Include stage'}">${icon(st.enabled ? 'eye' : 'eyeoff')}</button>
        <button class="ibtn xs" data-act="stage-menu" title="More" aria-label="More">${icon('more')}</button>
        <button class="ibtn xs" data-act="stage-collapse" title="${st.collapsed ? 'Expand' : 'Collapse'}" aria-label="${st.collapsed ? 'Expand' : 'Collapse'}">${icon(st.collapsed ? 'chevr' : 'chev')}</button>
      </div>
    </header>
    <div class="st-body">
      <div class="st-b"><div class="ed st-ed">${editorHtml(st)}</div><div class="pv st-pv"></div></div>
      <div class="st-msg"></div>
      <div class="st-code"></div>
    </div>
  </section>`;
}

function renderPipeline() {
  const parts = [sourceCardHtml()];
  state.stages.forEach((st, i) => {
    parts.push(`<div class="conn"><button class="ibtn conn-add" data-act="insert-at" data-index="${i}" title="Insert a stage here" aria-label="Insert a stage here">${icon('plus', 12)}</button></div>`);
    parts.push(stageCardHtml(st, i));
  });
  parts.push(`<div class="conn"></div>
    <div class="add-row">
      <button class="btn sm outline" data-act="add-stage">${icon('plus')} Add stage <span class="kbd">/</span></button>
      <span class="add-hint">${state.stages.length ? 'Rows flow top to bottom. Each stage previews what comes out of it.' : 'Start with a join, a filter or a group. Each stage previews what comes out of it.'}</span>
    </div>`);
  $('#pipeline').innerHTML = parts.join('');
  renderDerived();
}

function gridHtml(fields, rows, newOf) {
  const head = fields.map(f => {
    const isNew = newOf && newOf !== 'source' && (f.origin === newOf || f.selStage === newOf);
    const r = f.kind === 'number' ? ' r' : '';
    return `<th class="${isNew ? 'new' : ''}${r}"><div class="tn">${isNew ? '<span class="nd" title="Added by this stage"></span>' : ''}${fieldHtml(f)}</div><div class="tt">${esc(f.pgType || '')}</div></th>`;
  }).join('');
  const body = rows.map(row => `<tr>${fields.map(f => {
    const isNew = newOf && newOf !== 'source' && (f.origin === newOf || f.selStage === newOf);
    return `<td class="${f.kind === 'number' ? 'r' : ''}${isNew ? ' new' : ''}" title="${esc(row[f.id] === undefined ? '' : fmtPlain(row[f.id], f.kind))}">${cellHtml(row[f.id], f)}</td>`;
  }).join('')}</tr>`).join('');
  return `<table class="grid"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function previewHtml(info, id) {
  if (info.skipped) return '';
  if (info.error) return `<div class="pv-empty">${icon('alert')}<span>No preview until the stage is fixed.</span></div>`;
  if (info.incomplete) return `<div class="pv-empty">${icon('info')}<span>${esc(info.incomplete)} Rows pass through unchanged until then.</span></div>`;
  const rows = info.rows.slice(0, state.sample);
  if (!rows.length) return `<div class="pv-empty">${icon('info')}<span>No rows come out of this stage.</span></div>`;
  return `<div class="pv-scroll">${gridHtml(info.outFields, rows, id)}</div>
    <div class="pv-foot"><span>Showing ${rows.length} of ${fmtInt(info.count)} rows</span><span class="sp"></span><span>${info.outFields.length} columns</span></div>`;
}

function metaHtml(info) {
  if (info.skipped) return '<span class="chip">Skipped</span>';
  if (info.error) return `<span class="chip bad">${icon('alert', 12)} Error</span>`;
  if (info.incomplete) return '<span class="chip">Incomplete</span>';
  const delta = info.inCount != null ? info.count - info.inCount : 0;
  const d = delta ? `<span class="delta">${delta > 0 ? '+' : '−'}${fmtInt(Math.abs(delta))}</span>` : '';
  return `${d}<span>${fmtInt(info.count)} rows</span>`;
}

function summarize(st, info) {
  const F = new Map(info.inFields.map(f => [f.id, f]));
  const nm = id => { const f = F.get(id) || A.known.get(id); return f ? displayName(f) : '?'; };
  switch (st.type) {
    case 'join': {
      if (!st.table) return '';
      const p = st.on[0];
      return `${st.table} ${st.alias}${p.l && p.r ? ` on ${st.alias}.${p.r} = ${nm(p.l)}` : ''}`;
    }
    case 'filter': return condText(st.where, F, true);
    case 'group': {
      const keys = st.keys.filter(k => k.field).map(k => (k.bucket ? `${nm(k.field)} by ${k.bucket}` : nm(k.field)));
      const aggs = st.aggs.filter(a => AGGS[a.fn].noField || a.field).map(a => a.as);
      return `${keys.length ? keys.join(', ') : 'all rows'}${aggs.length ? ` · ${aggs.join(', ')}` : ''}`;
    }
    case 'compute': return st.cols.filter(c => c.fn).map(c => c.as).join(', ');
    case 'project': return `${info.outFields.length} of ${info.inFields.length} columns`;
    case 'sort': return st.keys.filter(k => k.field).map(k => `${nm(k.field)}${k.dir === 'desc' ? ' desc' : ''}`).join(', ');
    case 'limit': return `${st.limit} rows${Number(st.offset) ? `, skip ${st.offset}` : ''}`;
    case 'sql': return (st.sql.split('\n').find(l => l.trim()) || '').trim();
  }
  return '';
}

function msgHtml(info) {
  const out = [];
  if (info.error) out.push(`<div class="msg err">${icon('alert')}<span>${esc(info.error)}</span></div>`);
  if (info.newStep && info.stepReason) out.push(`<div class="msg">${icon('steps')}<span>Starts a new step: ${esc(info.stepReason)}. The stages above run first as <code>${info.newStep}</code>.</span></div>`);
  if (info.warn) out.push(`<div class="msg warn">${icon('alert')}<span>${esc(info.warn)}</span></div>`);
  if (info.note) out.push(`<div class="msg">${icon('info')}<span>${esc(info.note)}</span></div>`);
  return out.join('');
}

function sqlLinesHtml(lines) {
  let prev;
  const no = s => { const i = state.stages.findIndex(x => x.id === s); return i >= 0 ? String(i + 1) : ''; };
  return lines.map(l => {
    const num = l.s && l.s !== prev ? no(l.s) : '';
    prev = l.s;
    return `<div class="ln" data-s="${l.s || ''}"><span class="gut">${num}</span><span>${hlSql(l.t)}</span></div>`;
  }).join('');
}

function renderDerived() {
  for (const id of ['source', ...state.stages.map(s => s.id)]) {
    const card = $(`.st[data-stage="${id}"]`);
    if (!card) continue;
    const info = A.st[id];
    const st = stageById(id);
    card.querySelector('.st-meta').innerHTML = metaHtml(info);
    card.querySelector('.st-pv').innerHTML = previewHtml(info, id);
    if (!st) { card.querySelector('.st-sum').textContent = `${state.table} ${TABLES[state.table].alias}`; continue; }
    card.querySelector('.st-sum').textContent = summarize(st, info);
    const clause = info.clause && !info.skipped && !info.error && !info.incomplete
      ? `<span class="chip mono">${info.clause}</span>${info.newStep ? `<span class="chip mono" title="${esc(info.stepReason || 'Custom SQL runs as its own step')}">${icon('steps', 11)} ${info.newStep}</span>` : ''}`
      : '';
    card.querySelector('.st-clause').innerHTML = clause;
    card.querySelector('.st-msg').innerHTML = msgHtml(info);
    const lines = st.showSql ? A.lines.filter(l => l.s === id) : [];
    card.querySelector('.st-code').innerHTML = st.showSql
      ? (lines.length ? `<div class="sql" style="padding:0;background:none">${sqlLinesHtml(lines.map(l => ({ t: l.t.trim(), s: null })))}</div>` : '<div class="hint" style="padding:0 12px">This stage adds no SQL of its own yet.</div>')
      : '';
    for (const el of card.querySelectorAll('.cexpr')) {
      const expr = info.exprs && info.exprs[el.dataset.expr];
      el.textContent = expr || '';
    }
  }
  refreshChipLabels();
  renderSide();
}

// Labels of chosen columns can change while typing (a renamed aggregate), without a full re-render.
function refreshChipLabels() {
  for (const el of $$('#pipeline [data-fid]')) {
    const fid = el.dataset.fid;
    if (!fid) continue;
    const card = el.closest('[data-stage]');
    const info = A.st[card.dataset.stage];
    const tl = el.querySelector('.tl');
    if (!info || !tl) continue;
    const f = info.inFields.find(x => x.id === fid);
    tl.innerHTML = f ? fieldHtml(f) : esc((A.known.get(fid) && displayName(A.known.get(fid))) || 'removed');
    if (el.classList.contains('tok')) el.classList.toggle('tok-bad', !f);
  }
}

/* ---------- Side panel ---------- */
const KW = new Set('SELECT FROM WHERE AND OR NOT IN IS NULL JOIN LEFT INNER ON GROUP BY HAVING ORDER ASC DESC NULLS FIRST LAST LIMIT OFFSET WITH AS BETWEEN ILIKE LIKE OVER PARTITION DISTINCT CASE WHEN THEN ELSE END ARRAY FILTER'.split(' '));
function hlSql(s) {
  return s.replace(/('(?:[^']|'')*')|(--.*$)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|([^\sA-Za-z0-9_'])/g, (m, str, com, num, word, punct) => {
    if (str) return `<span class="s">${esc(str)}</span>`;
    if (com) return `<span class="c">${esc(com)}</span>`;
    if (num) return `<span class="n">${num}</span>`;
    if (word) {
      if (/^(NULL|TRUE|FALSE)$/.test(word)) return `<span class="n">${word}</span>`;
      if (KW.has(word) ) return `<span class="k">${word}</span>`;
      return `<span class="i2">${word}</span>`;
    }
    return `<span class="p">${esc(punct)}</span>`;
  });
}

function renderSide() {
  const side = $('#side');
  const sqlEl = side.querySelector('.sql');
  const scroll = sqlEl ? sqlEl.scrollTop : 0;
  const flow = [{ id: 'source', n: '', label: `<b>From</b> ${state.table}`, count: A.st.source.count }].concat(state.stages.map((st, i) => {
    const info = A.st[st.id];
    const bad = info.skipped ? 'Skipped' : info.error ? 'Error' : info.incomplete ? 'Incomplete' : null;
    return { id: st.id, n: i + 1, label: `<b>${STAGES[st.type].label}</b> ${esc(summarize(st, info))}`, count: bad ? null : info.count, bad };
  }));
  const max = Math.max(1, ...flow.map(f => f.count || 0));
  const notes = A.notes.length
    ? A.notes.map(n => `<p>${icon('steps', 12)}<span>${esc(n.text)}</span></p>`).join('')
    : `<p>${icon('info', 12)}<span>Each stage becomes a clause. Hover a stage to find its lines.</span></p>`;
  side.innerHTML = `
    <section class="panel">
      <header class="panel-h">${icon('rows')}<span class="panel-t">Row flow</span><span class="sp"></span><span class="panel-note">Rows out of each stage</span></header>
      <div class="flow">${flow.map(f => `
        <button class="flow-row" data-act="flow-go" data-value="${f.id}"><span class="fn">${f.n}</span><span class="fl">${f.label}</span>
          <span class="fb">${f.count != null ? `<span style="width:${Math.max(1.5, (f.count / max) * 100)}%"></span>` : ''}</span>
          <span class="fc">${f.count != null ? fmtInt(f.count) : `<span class="fs">${f.bad}</span>`}</span></button>`).join('')}
      </div>
    </section>
    <section class="panel sql-panel">
      <header class="panel-h">${icon('code')}<span class="panel-t">SQL</span>${A.ctes.length ? `<span class="count">${A.ctes.length + 1} steps</span>` : ''}<span class="sp"></span>
        <button class="ibtn xs" data-act="copy-sql" title="Copy SQL" aria-label="Copy SQL">${icon('copy')}</button>
        <button class="btn xs ghost" data-act="mode" data-value="sql">Edit as SQL</button></header>
      <div class="sql">${sqlLinesHtml(A.lines)}</div>
      <footer class="panel-f">${notes}</footer>
    </section>`;
  side.querySelector('.sql').scrollTop = scroll;
  applyHl();
}

function setHl(id) {
  if (state.hl === id) return;
  state.hl = id;
  applyHl();
}
function applyHl() {
  $$('.ln.hl, .st.hl, .flow-row.hl').forEach(e => e.classList.remove('hl'));
  const id = state.hl;
  if (!id) return;
  $$(`#side .ln[data-s="${id}"]`).forEach(e => e.classList.add('hl'));
  const card = $(`.st[data-stage="${id}"]`);
  if (card) card.classList.add('hl');
  const row = $(`.flow-row[data-value="${id}"]`);
  if (row) row.classList.add('hl');
}

/* ---------- Results ---------- */
function renderResults() {
  const R = $('#results');
  if (state.running) {
    R.innerHTML = `<section class="panel"><header class="panel-h">${icon('rows')}<span class="panel-t">Results</span></header><div class="empty"><p>Running…</p></div></section>`;
    return;
  }
  if (!state.run) {
    R.innerHTML = `<section class="panel"><header class="panel-h">${icon('rows')}<span class="panel-t">Results</span></header>
      <div class="empty"><p class="t">Run the query to see every row.</p><p>Stage previews above only show a ${state.sample}-row sample. <span class="kbd">${MOD} ↵</span></p></div></section>`;
    return;
  }
  const { fields, rows, ms, fromSql } = state.run;
  const per = 25;
  const pages = Math.max(1, Math.ceil(rows.length / per));
  state.page = Math.min(Math.max(0, state.page), pages - 1);
  const from = state.page * per;
  const slice = rows.slice(from, from + per);
  const stale = state.mode === 'builder' && sig() !== state.runSig;
  R.innerHTML = `
    <section class="panel">
      <header class="panel-h">${icon('rows')}<span class="panel-t">Results</span><span class="count">${fmtInt(rows.length)}</span>
        ${stale ? `<span class="chip warn">${icon('alert', 12)} Query changed since this run</span>` : ''}
        ${fromSql ? '<span class="chip">Showing the builder’s result. The app would run your edited SQL.</span>' : ''}
        <span class="sp"></span><span class="panel-note mono">${ms} ms</span></header>
      ${rows.length ? `<div class="res-scroll">${gridHtml(fields, slice, null)}</div>` : '<div class="empty"><p>No rows.</p></div>'}
      <footer class="res-foot"><span>Rows ${rows.length ? from + 1 : 0}–${from + slice.length} of ${fmtInt(rows.length)}</span><span class="sp"></span>
        <button class="ibtn xs" data-act="page" data-value="-1" ${state.page === 0 ? 'disabled' : ''} aria-label="Previous page">${icon('chevl', 14)}</button>
        <span class="mono">${state.page + 1} / ${pages}</span>
        <button class="ibtn xs" data-act="page" data-value="1" ${state.page >= pages - 1 ? 'disabled' : ''} aria-label="Next page">${icon('chevr', 14)}</button>
      </footer>
    </section>`;
}

function run() {
  state.running = true;
  renderResults();
  setTimeout(() => {
    state.running = false;
    state.run = {
      fields: A.final.fields, rows: A.final.rows, fromSql: state.mode === 'sql' && state.sqlDirty,
      ms: 3 + Math.round(A.final.rows.length / 30 + A.st.source.count / 80 + state.stages.length * 1.7),
    };
    state.runSig = sig();
    state.page = 0;
    renderResults();
  }, 220);
}

/* ---------- SQL mode ---------- */
function renderSqlMode() {
  $('#sqlmode').innerHTML = `
    <section class="panel">
      <header class="panel-h">${icon('code')}<span class="panel-t">SQL</span><span class="chip">Detached from the builder</span><span class="sp"></span>
        <button class="btn xs ghost" data-act="mode" data-value="builder">Back to builder</button></header>
      <textarea id="sqltext" class="sqltext" spellcheck="false" aria-label="SQL">${esc(state.sqlDraft)}</textarea>
      <footer class="panel-f"><p>${icon('info', 12)}<span>Edits here don't flow back into the stages. Going back to the builder discards them.</span></p></footer>
    </section>`;
}
function setMode(mode) {
  if (mode === state.mode) return;
  if (mode === 'builder' && state.sqlDirty && !confirm('Discard your SQL edits and go back to the builder?')) return;
  state.mode = mode;
  if (mode === 'sql') { state.sqlDraft = A.sql; state.sqlDirty = false; }
  $('#builder').hidden = mode !== 'builder';
  $('#sqlmode').hidden = mode !== 'sql';
  if (mode === 'sql') renderSqlMode();
  renderQbar();
  renderResults();
  if (mode === 'sql') $('#sqltext').focus();
}

/* =====================================================================
   Menus (single popover used for every picker)
   ===================================================================== */
let menu = null;
function openMenu(anchor, cfg) {
  closeMenu();
  const el = document.createElement('div');
  el.className = 'menu';
  el.tabIndex = -1;
  el.style.width = `${cfg.width || 280}px`;
  el.innerHTML = `${cfg.search ? `<div class="menu-search">${icon('search')}<input placeholder="${esc(cfg.placeholder || 'Search')}" aria-label="Search"></div>` : ''}<div class="menu-list" role="listbox"></div>`;
  $('#menu-root').appendChild(el);
  menu = { el, cfg, anchor, q: '', active: Math.max(0, cfg.items.findIndex(it => it.selected)), items: [] };
  renderMenuList();
  positionMenu();
  const input = el.querySelector('input');
  (input || el).focus({ preventScroll: true });
  if (input) input.addEventListener('input', () => { menu.q = input.value; menu.active = 0; renderMenuList(); });
  el.addEventListener('keydown', menuKey);
}
function positionMenu() {
  const { el, anchor } = menu;
  const r = anchor.getBoundingClientRect();
  const h = el.offsetHeight, w = el.offsetWidth;
  let top = r.bottom + 4;
  if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 4);
  el.style.top = `${top}px`;
  el.style.left = `${Math.max(8, Math.min(r.left, innerWidth - w - 8))}px`;
}
function menuItems() {
  const { cfg } = menu;
  const q = menu.q.trim().toLowerCase();
  let items = cfg.items.filter(it => !q || `${it.label} ${it.desc || ''} ${it.group || ''}`.toLowerCase().includes(q));
  if (cfg.freeform) {
    const extra = cfg.freeform(menu.q.trim());
    if (extra) items = [extra, ...items];
  }
  return items;
}
function renderMenuList() {
  const items = menuItems();
  menu.items = items;
  const enabled = items.map((it, i) => (it.disabled ? -1 : i)).filter(i => i >= 0);
  if (!enabled.includes(menu.active)) menu.active = enabled[0] ?? -1;
  let group;
  const html = items.map((it, i) => {
    let h = '';
    if (it.group && it.group !== group) { group = it.group; h += `<div class="mg">${esc(group)}</div>`; }
    const sel = menu.cfg.multi ? menu.cfg.isSelected(it) : it.selected;
    h += `<div class="mi ${i === menu.active ? 'on' : ''} ${it.disabled ? 'dis' : ''}" data-i="${i}" role="option" aria-selected="${!!sel}">
      ${menu.cfg.multi || menu.cfg.checks ? `<span class="ck">${sel ? icon('check', 14) : ''}</span>` : ''}
      ${it.icon ? icon(it.icon) : ''}
      <span class="mt"><span class="ml ${it.mono ? 'mono' : ''}">${it.html || esc(it.label)}</span>${it.desc ? `<span class="md">${esc(it.desc)}</span>` : ''}</span>
      ${it.hint ? `<span class="mh">${esc(it.hint)}</span>` : ''}</div>`;
    return h;
  }).join('');
  const list = menu.el.querySelector('.menu-list');
  list.innerHTML = html || `<div class="menu-empty">${esc(menu.cfg.empty || 'Nothing matches.')}</div>`;
  list.querySelectorAll('.mi').forEach(node => {
    node.addEventListener('mousedown', e => e.preventDefault());
    node.addEventListener('click', () => pickMenu(Number(node.dataset.i)));
    node.addEventListener('mousemove', () => {
      const i = Number(node.dataset.i);
      if (menu.active !== i) { menu.active = i; list.querySelectorAll('.mi').forEach(n => n.classList.toggle('on', Number(n.dataset.i) === i)); }
    });
  });
  const on = list.querySelector('.mi.on');
  if (on) on.scrollIntoView({ block: 'nearest' });
}
function menuKey(e) {
  const enabled = menu.items.map((it, i) => (it.disabled ? -1 : i)).filter(i => i >= 0);
  const pos = enabled.indexOf(menu.active);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!enabled.length) return;
    const next = e.key === 'ArrowDown' ? (pos + 1) % enabled.length : (pos - 1 + enabled.length) % enabled.length;
    menu.active = enabled[next];
    renderMenuList();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (menu.active >= 0) pickMenu(menu.active);
  } else if (e.key === 'Escape' || e.key === 'Tab') {
    e.preventDefault();
    const anchor = menu.anchor;
    closeMenu();
    if (anchor && anchor.isConnected) anchor.focus();
  }
}
function pickMenu(i) {
  const it = menu.items[i];
  if (!it || it.disabled) return;
  const { cfg } = menu;
  if (cfg.multi) { cfg.onPick(it); renderMenuList(); return; }
  closeMenu();
  cfg.onPick(it);
}
function closeMenu() {
  if (!menu) return;
  menu.el.remove();
  menu = null;
}
document.addEventListener('mousedown', e => { if (menu && !menu.el.contains(e.target)) closeMenu(); });
window.addEventListener('resize', closeMenu);
// Menus follow their anchor while the workspace scrolls (e.g. a new stage scrolling into view).
$('#content').addEventListener('scroll', () => {
  if (!menu) return;
  if (menu.anchor.isConnected) positionMenu(); else closeMenu();
});

const kindLabel = { number: 'number', text: 'text', enum: 'enum', time: 'date or time', bool: 'boolean', json: 'JSON', array: 'array' };
function fieldGroup(f) {
  if (f.cte) return `From ${f.cte}`;
  if (f.agg) return 'Aggregates';
  if (f.table && f.base) return `${f.table} ${f.rel}`;
  return 'Calculated';
}
function fieldItem(f, value, selected) {
  return { html: fieldHtml(f), label: displayName(f), mono: true, hint: f.pgType, value, group: fieldGroup(f), icon: f.pk ? 'key' : f.fk ? 'link' : null, selected };
}
function openFieldMenu(anchor, fields, kinds, optional, current, onPick) {
  const items = [];
  if (optional) items.push({ label: 'All rows', desc: 'No PARTITION BY', value: null, group: 'Partition' });
  for (const f of fields) {
    if (kinds && !kinds.includes(f.kind)) continue;
    items.push(fieldItem(f, f.id, f.id === current));
  }
  openMenu(anchor, {
    items, search: true, placeholder: 'Search columns', width: 300,
    empty: kinds ? `No ${kinds.map(k => kindLabel[k]).join(' or ')} columns reach this stage.` : 'No columns.',
    onPick: it => onPick(it.value),
  });
}
function parseChoices(s) { return s.split('|').filter(Boolean).map(p => { const i = p.indexOf(':'); return [p.slice(0, i), p.slice(i + 1)]; }); }

/* =====================================================================
   Actions
   ===================================================================== */
function anchorSelector(el) {
  const card = el.closest('[data-stage]');
  let s = card ? `[data-stage="${card.dataset.stage}"] ` : '';
  s += `[data-act="${el.dataset.act}"]`;
  if (el.dataset.path) s += `[data-path="${el.dataset.path}"]`;
  return s;
}
// Re-render, then put focus back on the equivalent control so keyboard flow continues.
function commitFrom(el) {
  const sel = anchorSelector(el);
  commit(true);
  const again = $(sel);
  if (again) again.focus({ preventScroll: true });
}
function autoOpen(stId, path, act = 'pick-field') {
  setTimeout(() => {
    const el = $(`[data-stage="${stId}"] [data-act="${act}"]${path ? `[data-path="${path}"]` : ''}`);
    if (!el) return;
    el.scrollIntoView({ block: 'nearest' });
    el.focus({ preventScroll: true });
    el.click();
  });
}
function autoOpenFor(st) {
  switch (st.type) {
    case 'join': if (!st.table) autoOpen(st.id, '', 'pick-join-table'); break;
    case 'filter': autoOpen(st.id, 'where.items.0.field'); break;
    case 'group': autoOpen(st.id, 'keys.0.field'); break;
    case 'compute': autoOpen(st.id, 'cols.0', 'pick-fn'); break;
    case 'sort': autoOpen(st.id, 'keys.0.field'); break;
    case 'limit': setTimeout(() => { const i = $(`[data-stage="${st.id}"] [data-bind="limit"]`); if (i) { i.focus(); i.select(); } }); break;
    case 'sql': setTimeout(() => { const t = $(`[data-stage="${st.id}"] textarea`); if (t) t.focus(); }); break;
  }
}
function insertStage(index, st) {
  state.stages.splice(index, 0, st);
  commit(true);
  const card = $(`.st[data-stage="${st.id}"]`);
  if (card) card.scrollIntoView({ block: 'nearest' });
  autoOpenFor(st);
}
function openAddMenu(anchor, index) {
  const inF = fieldsBefore(index);
  const joined = new Set(inF.filter(f => f.table).map(f => f.table));
  const sugg = joinSuggestions(inF).filter(s => !joined.has(s.table)).slice(0, 4);
  const items = [
    ...sugg.map(s => ({ label: `Join ${s.table}`, desc: `${s.card} via ${s.hint}`, value: { type: 'join', s }, group: 'Suggested', icon: 'link' })),
    ...Object.entries(STAGES).map(([k, v]) => ({ label: v.label, desc: v.desc, value: { type: k }, group: 'Stages', icon: v.icon })),
  ];
  openMenu(anchor, { items, search: true, placeholder: 'Add a stage', width: 320, onPick: it => insertStage(index, newStage(it.value.type, inF, it.value.s)) });
}
function cloneStage(st) {
  const copy = JSON.parse(JSON.stringify(st));
  copy.id = uid('s');
  (copy.keys || []).forEach(k => { if (k.id) k.id = uid('k'); });
  (copy.aggs || []).forEach(a => { a.id = uid('a'); });
  if (copy.type === 'compute') copy.cols.forEach(c => { c.id = uid('x'); });
  return copy;
}
function moveStage(from, to) {
  const [st] = state.stages.splice(from, 1);
  state.stages.splice(to, 0, st);
}
function copySql() {
  const text = state.mode === 'sql' ? $('#sqltext').value : A.sql;
  const done = () => toast('SQL copied');
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => toast('Couldn’t copy. Select the SQL and copy it instead.'));
}
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('out'), 1600);
  setTimeout(() => t.remove(), 1800);
}

function afterFieldPick(st, path, id, fields) {
  const f = fields.find(x => x.id === id);
  const parentPath = path.split('.').slice(0, -1).join('.');
  const parent = parentPath ? getPath(st, parentPath) : st;
  if (st.type === 'filter' && parent.k === 'cond' && f) {
    parent.op = DEFAULT_OP[f.kind] || 'eq';
    parent.value = defaultValue(opOf(f, parent.op).v, f);
  }
  if (st.type === 'group' && path.startsWith('keys.')) parent.bucket = f && f.kind === 'time' ? 'month' : null;
  if (st.type === 'group' && path.startsWith('aggs.') && parent.asAuto) parent.as = defaultAggName(parent, f);
}

const ACT = {
  'pick-field'(el, st) {
    const info = A.st[st.id];
    const kinds = el.dataset.kinds ? el.dataset.kinds.split(',') : null;
    const path = el.dataset.path;
    openFieldMenu(el, info.inFields, kinds, el.dataset.optional === '1', getPath(st, path), id => {
      setPath(st, path, id);
      afterFieldPick(st, path, id, info.inFields);
      commitFrom(el);
      if (st.type === 'filter' && id) {
        const cond = getPath(st, path.split('.').slice(0, -1).join('.'));
        const f = info.inFields.find(x => x.id === id);
        const o = f && opOf(f, cond.op);
        if (o && o.v === 'enum') autoOpen(st.id, path.replace(/\.field$/, ''), 'pick-enum');
        else setTimeout(() => { const i = $(`[data-stage="${st.id}"] [data-bind^="${path.replace(/\.field$/, '.value')}"]`); if (i) i.focus(); });
      }
    });
  },
  'pick-operand'(el, st) {
    const info = A.st[st.id];
    const kinds = el.dataset.kinds ? el.dataset.kinds.split(',') : null;
    const path = el.dataset.path;
    const numeric = kinds && kinds.every(k => k === 'number');
    openMenu(el, {
      items: info.inFields.filter(f => !kinds || kinds.includes(f.kind)).map(f => fieldItem(f, { f: f.id })),
      search: true, width: 300, placeholder: numeric ? 'Column, or type a number' : 'Column, or type a value',
      freeform: q => {
        if (!q) return null;
        const n = Number(q);
        if (Number.isFinite(n)) return { label: `Use ${n}`, value: { n }, group: 'Value', icon: 'plus' };
        if (numeric) return null;
        return { label: `Use '${q}'`, value: { s: q }, group: 'Value', icon: 'plus' };
      },
      onPick: it => { setPath(st, path, it.value); commitFrom(el); },
    });
  },
  'pick-op'(el, st) {
    const c = getPath(st, el.dataset.path);
    const f = lookupField(st, c.field);
    if (!f) return;
    openMenu(el, {
      items: (OPS[f.kind] || OPS.text).map(o => ({ label: o.label, value: o.id, selected: o.id === c.op })), checks: true, width: 200,
      onPick: it => {
        const prev = opOf(f, c.op);
        c.op = it.value;
        const o = opOf(f, c.op);
        if (!prev || prev.v !== o.v) c.value = defaultValue(o.v, f);
        commitFrom(el);
      },
    });
  },
  'pick-enum'(el, st) {
    const c = getPath(st, el.dataset.path);
    const f = lookupField(st, c.field);
    const vals = (f && f.enumVals) || [];
    openMenu(el, {
      multi: true, width: 220, items: vals.map(v => ({ label: v, value: v, mono: true })),
      isSelected: it => (c.value || []).includes(it.value),
      onPick: it => {
        const cur = new Set(c.value || []);
        if (cur.has(it.value)) cur.delete(it.value); else cur.add(it.value);
        c.value = vals.filter(v => cur.has(v));
        commit(true);
      },
    });
  },
  'pick-choice'(el, st) {
    const path = el.dataset.path;
    const cur = getPath(st, path);
    const free = el.dataset.free === '1';
    openMenu(el, {
      items: parseChoices(el.dataset.choices).map(([v, l]) => ({ label: l, value: v, selected: String(cur ?? '') === v })), checks: true,
      search: free, placeholder: 'Type a key', width: 200,
      freeform: free ? q => (q ? { label: `Use "${q}"`, value: q, icon: 'plus' } : null) : null,
      onPick: it => { setPath(st, path, it.value === '' ? null : it.value); commitFrom(el); },
    });
  },
  'toggle-andor'(el, st) { const g = getPath(st, el.dataset.path); g.op = g.op === 'and' ? 'or' : 'and'; commitFrom(el); },
  'add-cond'(el, st) {
    const g = getPath(st, el.dataset.path);
    g.items.push(emptyCond());
    commit(true);
    autoOpen(st.id, `${el.dataset.path}.items.${g.items.length - 1}.field`);
  },
  'add-group'(el, st) {
    const g = getPath(st, el.dataset.path);
    g.items.push({ k: 'group', op: 'or', items: [emptyCond()] });
    commit(true);
    autoOpen(st.id, `${el.dataset.path}.items.${g.items.length - 1}.items.0.field`);
  },
  'add-raw'(el, st) {
    const g = getPath(st, el.dataset.path);
    g.items.push({ k: 'raw', sql: '' });
    commit(true);
    const input = $(`[data-stage="${st.id}"] [data-bind="${el.dataset.path}.items.${g.items.length - 1}.sql"]`);
    if (input) input.focus();
  },
  del(el, st) {
    const parts = el.dataset.path.split('.');
    const idx = Number(parts.pop());
    getPath(st, parts.join('.')).splice(idx, 1);
    commit(true);
  },
  set(el, st) { setPath(st, el.dataset.path, el.dataset.value); commitFrom(el); },
  'pick-join-table'(el, st) {
    const inF = A.st[st.id].inFields;
    const sugg = joinSuggestions(inF);
    const items = [
      ...sugg.map(s => ({ label: s.table, mono: true, desc: `${s.card} via ${s.hint}`, value: s, group: 'Related', icon: 'link' })),
      ...TABLE_ORDER.map(t => ({ label: t, mono: true, hint: `${TABLES[t].columns.length} cols`, value: { table: t }, group: 'All tables', icon: 'table' })),
    ];
    openMenu(el, {
      items, search: true, placeholder: 'Search tables', width: 320,
      onPick: it => {
        const s = it.value;
        st.table = s.table;
        st.alias = uniqueAlias(s.table, inF);
        st.on = [{ l: s.l || null, r: s.r || null }];
        commitFrom(el);
        if (!s.r) autoOpen(st.id, '', 'pick-join-col');
      },
    });
  },
  'pick-join-col'(el, st) {
    openMenu(el, {
      items: TABLES[st.table].columns.map(c => ({ label: c.name, mono: true, hint: c.type, value: c.name, icon: c.pk ? 'key' : c.fk ? 'link' : null, selected: st.on[0].r === c.name })),
      search: true, placeholder: `Columns of ${st.table}`, width: 280,
      onPick: it => { st.on[0].r = it.value; commitFrom(el); if (!st.on[0].l) autoOpen(st.id, 'on.0.l'); },
    });
  },
  'add-key'(el, st) { st.keys.push({ id: uid('k'), field: null, bucket: null }); commit(true); autoOpen(st.id, `keys.${st.keys.length - 1}.field`); },
  'add-agg'(el, st) { st.aggs.push({ id: uid('a'), fn: 'count', field: null, as: 'count', asAuto: true }); commit(true); autoOpen(st.id, `aggs.${st.aggs.length - 1}`, 'pick-aggfn'); },
  'pick-aggfn'(el, st) {
    const a = getPath(st, el.dataset.path);
    openMenu(el, {
      items: Object.entries(AGGS).map(([k, v]) => ({ label: v.label, hint: v.hint, value: k, selected: a.fn === k })), checks: true, width: 260,
      onPick: it => {
        a.fn = it.value;
        const def = AGGS[a.fn];
        const f = a.field ? lookupField(st, a.field) : null;
        if (def.noField) a.field = null;
        else if (f && def.kinds && !def.kinds.includes(f.kind)) a.field = null;
        if (a.asAuto) a.as = defaultAggName(a, a.field ? lookupField(st, a.field) : null);
        commitFrom(el);
        if (!def.noField && !a.field) autoOpen(st.id, `${el.dataset.path}.field`);
      },
    });
  },
  'add-col'(el, st) { st.cols.push({ id: uid('x'), as: 'new_column', asAuto: true, fn: null, args: {} }); commit(true); autoOpen(st.id, `cols.${st.cols.length - 1}`, 'pick-fn'); },
  'pick-fn'(el, st) {
    const c = getPath(st, el.dataset.path);
    openMenu(el, {
      items: Object.entries(FUNCS).map(([k, f]) => ({ label: f.label, desc: f.desc, value: k, group: f.g, selected: c.fn === k })), checks: true,
      search: true, placeholder: 'Search functions', width: 320,
      onPick: it => {
        c.fn = it.value;
        const fn = FUNCS[c.fn];
        c.args = {};
        fn.args.forEach(a => {
          if (a.t === 'choice') c.args[a.k] = a.def ?? a.choices[0];
          if (a.t === 'text') c.args[a.k] = a.def ?? '';
        });
        if (c.asAuto) c.as = fn.name;
        commitFrom(el);
        const first = fn.args.find(a => a.t === 'field');
        if (first) autoOpen(st.id, `${el.dataset.path}.args.${first.k}`);
        else if (c.fn === 'raw') setTimeout(() => { const i = $(`[data-stage="${st.id}"] [data-bind="${el.dataset.path}.args.expr"]`); if (i) i.focus(); });
      },
    });
  },
  'proj-toggle'(el, st) {
    const c = st.cols.find(x => x.field === el.dataset.fid);
    if (c) c.on = !c.on; else st.cols.push({ field: el.dataset.fid, as: '', on: true });
    commit(true);
  },
  'proj-all'(el, st) {
    A.st[st.id].inFields.forEach(f => {
      const c = st.cols.find(x => x.field === f.id);
      if (c) c.on = true; else st.cols.push({ field: f.id, as: '', on: true });
    });
    commit(true);
  },
  'proj-none'(el, st) { st.cols.forEach(c => { c.on = false; }); commit(true); },
  'proj-move'(el, st) {
    const fid = el.dataset.fid;
    if (!st.cols.some(c => c.field === fid)) st.cols.push({ field: fid, as: '', on: false });
    const i = st.cols.findIndex(c => c.field === fid);
    const j = i + Number(el.dataset.dir);
    if (j < 0 || j >= st.cols.length) return;
    [st.cols[i], st.cols[j]] = [st.cols[j], st.cols[i]];
    commit(true);
  },
  'add-sort'(el, st) { st.keys.push({ field: null, dir: 'asc', nulls: 'default' }); commit(true); autoOpen(st.id, `keys.${st.keys.length - 1}.field`); },
  'stage-toggle'(el, st) { st.enabled = !st.enabled; commitFrom(el); },
  'stage-collapse'(el, st) {
    if (st) st.collapsed = !st.collapsed; else state.sourceCollapsed = !state.sourceCollapsed;
    commitFrom(el);
  },
  'stage-sql'(el, st) { st.showSql = !st.showSql; commitFrom(el); },
  'stage-menu'(el, st) {
    const i = state.stages.indexOf(st);
    openMenu(el, {
      width: 200,
      items: [
        { label: 'Move up', value: 'up', icon: 'up', disabled: i === 0 },
        { label: 'Move down', value: 'down', icon: 'chev', disabled: i === state.stages.length - 1 },
        { label: 'Duplicate', value: 'dup', icon: 'dup' },
        { label: 'Delete', value: 'del', icon: 'trash' },
      ],
      onPick: it => {
        if (it.value === 'up') moveStage(i, i - 1);
        if (it.value === 'down') moveStage(i, i + 1);
        if (it.value === 'dup') state.stages.splice(i + 1, 0, cloneStage(st));
        if (it.value === 'del') state.stages.splice(i, 1);
        commit(true);
      },
    });
  },
  'insert-at'(el) { openAddMenu(el, Number(el.dataset.index)); },
  'add-stage'(el) { openAddMenu(el, state.stages.length); },
  'quick-join'(el) {
    const s = JSON.parse(el.dataset.value);
    let idx = 0;
    while (idx < state.stages.length && state.stages[idx].type === 'join') idx++;
    insertStage(idx, newStage('join', fieldsBefore(idx), s));
  },
  'flow-go'(el) {
    const card = $(`.st[data-stage="${el.dataset.value}"]`);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  },
  run() { run(); },
  'copy-sql'() { copySql(); },
  mode(el) { setMode(el.dataset.value); },
  sample(el) { state.sample = Number(el.dataset.value); renderQbar(); renderDerived(); renderResults(); },
  theme() {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = state.theme;
    renderChrome();
  },
  'load-example'() { state.stages = exampleStages(); state.run = null; commit(true); },
  clear() { state.stages = []; state.run = null; commit(true); },
  'pick-table'(el) {
    if (state.mode === 'sql') setMode('builder');
    if (state.mode === 'sql') return;
    state.table = el.dataset.value;
    state.stages = exampleStages();
    state.run = null;
    renderChrome();
    renderQbar();
    commit(true);
  },
  page(el) { state.page += Number(el.dataset.value); renderResults(); },
  noop() { toast('Only the Query tab is part of this prototype.'); },
};

/* ---------- Event wiring ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.closest('.menu')) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  const card = el.closest('[data-stage]');
  const st = card ? stageById(card.dataset.stage) : null;
  fn(el, st, e);
});

function readBind(el) {
  const t = el.dataset.type;
  if (t === 'csv') return el.value.split(',').map(s => s.trim()).filter(Boolean);
  if (t === 'num') return el.value === '' ? '' : Number(el.value);
  if (t === 'int') return el.value === '' ? '' : Math.max(0, Math.floor(Number(el.value)));
  return el.value;
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'sqltext') { state.sqlDraft = el.value; state.sqlDirty = el.value !== A.sql; return; }
  if (el.dataset.bind == null) return;
  const card = el.closest('[data-stage]');
  const st = card && stageById(card.dataset.stage);
  if (!st) return;
  const path = el.dataset.bind;
  setPath(st, path, readBind(el));
  // A name typed by hand stops following the function or column it was generated from.
  if (path.endsWith('.as')) {
    const parent = getPath(st, path.slice(0, -3));
    if (parent && 'asAuto' in parent) parent.asAuto = false;
  }
  commit(false);
});

const isTyping = el => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); closeMenu(); run(); return; }
  if (e.key === '/' && !menu && !isTyping(e.target) && state.mode === 'builder') {
    e.preventDefault();
    const btn = $('[data-act="add-stage"]');
    btn.scrollIntoView({ block: 'nearest' });
    openAddMenu(btn, state.stages.length);
  }
});

// Hover sync between stage cards, SQL lines and the row flow.
document.addEventListener('mouseover', e => {
  const card = e.target.closest('.st[data-stage]');
  if (card) return setHl(card.dataset.stage);
  const line = e.target.closest('#side .ln');
  if (line) return setHl(line.dataset.s || null);
  const flow = e.target.closest('.flow-row');
  if (flow) return setHl(flow.dataset.value);
  setHl(null);
});

// Drag stages by their grip to reorder.
let dragId = null;
const pipeline = $('#pipeline');
pipeline.addEventListener('mousedown', e => {
  const grip = e.target.closest('[data-drag]');
  if (grip) grip.closest('.st').draggable = true;
});
pipeline.addEventListener('dragstart', e => {
  const card = e.target.closest('.st');
  if (!card || !card.draggable) return;
  dragId = card.dataset.stage;
  card.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragId);
});
pipeline.addEventListener('dragover', e => {
  if (!dragId) return;
  const card = e.target.closest('.st');
  $$('.drop-before, .drop-after').forEach(c => c.classList.remove('drop-before', 'drop-after'));
  if (!card || card.dataset.stage === 'source' || card.dataset.stage === dragId) return;
  e.preventDefault();
  const r = card.getBoundingClientRect();
  card.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
});
pipeline.addEventListener('drop', e => {
  const card = e.target.closest('.st');
  if (!dragId || !card || card.dataset.stage === 'source') return;
  e.preventDefault();
  const after = card.classList.contains('drop-after');
  const from = state.stages.findIndex(s => s.id === dragId);
  const [st] = state.stages.splice(from, 1);
  let to = state.stages.findIndex(s => s.id === card.dataset.stage);
  if (to < 0) to = from;
  state.stages.splice(after ? to + 1 : to, 0, st);
  commit(true);
});
pipeline.addEventListener('dragend', () => {
  dragId = null;
  $$('.st[draggable="true"]').forEach(c => { c.draggable = false; c.classList.remove('dragging'); });
  $$('.drop-before, .drop-after').forEach(c => c.classList.remove('drop-before', 'drop-after'));
});

/* =====================================================================
   Boot
   ===================================================================== */
genData();
state.stages = exampleStages();
renderChrome();
renderQbar();
commit(true);
</script>
</body>
</html>
