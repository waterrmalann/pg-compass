<!doctype html>
<!--
  PG Compass: Query builder prototype (UX only, not wired to the app).

  The idea: a SQL query is a pipeline of stages that follow SQL's logical order
  (FROM → JOIN → WHERE → GROUP BY → HAVING → SELECT/window → ORDER BY → LIMIT).
  Each stage previews the rows it produces, like Compass's aggregation panel.
  Stages compile into one SELECT while they fit; when a stage can't fit the
  current SELECT (filtering a window result, sorting after a limit…) the
  stages above it become a CTE step automatically, and the SQL panel says why.

  Everything runs in-memory on generated demo data for a fictional roastery.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Query builder prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --font-sans: "Geist", "Geist Variable", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "Geist Mono", "Geist Mono Variable", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --background: #ffffff;
  --foreground: #262626;
  --card: #ffffff;
  --popover: #ffffff;
  --primary: #262626;
  --primary-foreground: #fafafa;
  --muted: color-mix(in oklab, #000 4%, transparent);
  --muted-foreground: color-mix(in srgb, #737373 90%, #000);
  --subtle-foreground: color-mix(in srgb, var(--foreground) 72%, transparent);
  --accent: color-mix(in oklab, #000 4%, transparent);
  --border: color-mix(in oklab, #000 8%, transparent);
  --input: color-mix(in oklab, #000 10%, transparent);
  --ring: #a3a3a3;
  --destructive: #fb2c36;
  --destructive-foreground: #c10007;
  --warning: #fe9a00;
  --warning-foreground: #bb4d00;
  --success-foreground: #007a55;
  --info-foreground: #1447e6;
  --sidebar: #fafafa;
  --sidebar-foreground: color-mix(in srgb, #262626 64%, #fafafa);
  --sidebar-accent: color-mix(in oklab, #000 4%, transparent);
  --sidebar-border: color-mix(in oklab, #000 6%, transparent);
  --code: #ffffff;
  --code-highlight: color-mix(in oklab, #000 5%, transparent);
  --chart-ink: #525252;
  --conn-dot: #2a78d6;
  --shadow-pop: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1);
  --outline-bg: var(--background);
  --outline-border: var(--border);
  --edge: transparent;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --background: color-mix(in srgb, #0a0a0a 96%, #fff);
  --foreground: #f5f5f5;
  --card: color-mix(in srgb, var(--background) 98%, #fff);
  --popover: color-mix(in srgb, var(--background) 98%, #fff);
  --primary: #f5f5f5;
  --primary-foreground: #262626;
  --muted: color-mix(in oklab, #fff 4%, transparent);
  --muted-foreground: color-mix(in srgb, #737373 90%, #fff);
  --accent: color-mix(in oklab, #fff 4%, transparent);
  --border: color-mix(in oklab, #fff 6%, transparent);
  --input: color-mix(in oklab, #fff 8%, transparent);
  --ring: #737373;
  --destructive: color-mix(in srgb, #fb2c36 90%, #fff);
  --destructive-foreground: #ff6467;
  --warning-foreground: #ffb900;
  --success-foreground: #00d492;
  --info-foreground: #51a2ff;
  --sidebar: color-mix(in srgb, #0a0a0a 97%, #fff);
  --sidebar-foreground: color-mix(in srgb, #f5f5f5 64%, var(--sidebar));
  --sidebar-accent: color-mix(in oklab, #fff 4%, transparent);
  --sidebar-border: color-mix(in oklab, #fff 5%, transparent);
  --code: color-mix(in srgb, var(--background) 98%, #fff);
  --code-highlight: color-mix(in oklab, #fff 5%, transparent);
  --chart-ink: #a3a3a3;
  --conn-dot: #3987e5;
  --shadow-pop: 0 12px 28px -8px rgb(0 0 0 / .6), 0 4px 8px -4px rgb(0 0 0 / .4);
  --outline-bg: color-mix(in oklab, #fff 2.5%, transparent);
  --outline-border: color-mix(in oklab, #fff 8%, transparent);
  --edge: color-mix(in oklab, #fff 6%, transparent);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--background); color: var(--foreground);
  font: 14px/1.43 var(--font-sans); -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
code, .mono { font-family: var(--font-mono); }
.i { flex: none; display: block; }
.sp { flex: 1; }
.muted { color: var(--muted-foreground); }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100vh; }
.sidebar {
  background: var(--sidebar); border-right: 1px solid var(--sidebar-border);
  padding: 8px; overflow: auto; display: flex; flex-direction: column; gap: 8px;
}
.brand { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px; font-weight: 600; font-size: 14px; }
.conn-card {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  border: 1px solid var(--sidebar-border); background: color-mix(in oklab, var(--background) 40%, transparent);
  border-radius: 10px; padding: 8px; color: var(--muted-foreground);
}
.conn-card .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--conn-dot); flex: none; }
.cc-t { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.cc-n { font: 500 13px var(--font-mono); color: var(--foreground); }
.cc-s { font-size: 11px; color: var(--subtle-foreground); }
.sb-search {
  display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 10px;
  border: 1px solid var(--input); border-radius: 10px; color: var(--muted-foreground); font-size: 13px;
}
.sb-label { margin: 8px 8px 0; font-size: 12px; color: var(--muted-foreground); display: flex; }
.tree { display: flex; flex-direction: column; gap: 1px; }
.tr {
  display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px 0 12px; border-radius: 8px;
  font: 12.5px var(--font-mono); color: var(--sidebar-foreground); text-align: left;
}
.tr:hover { background: var(--sidebar-accent); color: var(--foreground); }
.tr.on { background: var(--sidebar-accent); color: var(--foreground); }
.tr .tn { flex: 1; }
.tr .tc { font-size: 11px; color: var(--subtle-foreground); }
.sb-foot { margin-top: auto; padding: 8px; font-size: 11px; color: var(--subtle-foreground); }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.tabstrip {
  height: 40px; flex: none; display: flex; align-items: flex-end; gap: 2px; padding: 0 8px;
  background: var(--sidebar); border-bottom: 1px solid var(--border);
}
.tab {
  display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; font: 12.5px var(--font-mono);
  color: var(--muted-foreground); border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0;
}
.tab.on { background: var(--background); border-color: var(--border); color: var(--foreground); margin-bottom: -1px; height: 33px; }
.topbar {
  height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px;
  border-bottom: 1px solid var(--border); background: color-mix(in oklab, var(--background) 85%, transparent);
}
.bc { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted-foreground); min-width: 0; }
.bc .sep { opacity: .7; }
.bc .cur { color: var(--foreground); font-weight: 500; }
.content { flex: 1; overflow: auto; padding: 16px; }

/* ---------- Primitives ---------- */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  white-space: nowrap; border-radius: 10px; border: 1px solid transparent;
  height: 32px; padding: 0 10px; font-size: 14px; font-weight: 500; line-height: 20px;
  transition: background-color .15s, color .15s, box-shadow .15s, transform .16s cubic-bezier(.23, 1, .32, 1);
}
.btn:active { transform: scale(.98); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.btn.xs { height: 24px; padding: 0 8px; font-size: 12px; border-radius: 8px; gap: 4px; }
.btn.primary {
  background: var(--primary); color: var(--primary-foreground); border-color: var(--primary);
  box-shadow: inset 0 1px 0 color-mix(in oklab, #fff 16%, transparent), 0 1px 2px rgb(0 0 0 / .05);
}
.btn.primary:hover { background: color-mix(in oklab, var(--primary) 90%, transparent); }
.btn.outline { background: var(--outline-bg); border-color: var(--outline-border); box-shadow: inset 0 1px 0 var(--edge), 0 1px 2px rgb(0 0 0 / .05); }
.btn.outline:hover { background: color-mix(in oklab, var(--accent) 50%, var(--outline-bg)); }
.btn.ghost { color: var(--muted-foreground); }
.btn.ghost:hover { background: var(--accent); color: var(--foreground); }
.btn:focus-visible, .tok:focus-visible, .ibtn:focus-visible, .seg button:focus-visible, .tr:focus-visible, .flow-row:focus-visible, .rel:focus-visible, .joiner:focus-visible {
  outline: 2px solid var(--ring); outline-offset: 2px;
}
.ibtn {
  display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px;
  color: var(--muted-foreground); transition: background-color .15s, color .15s;
}
.ibtn:hover { background: var(--accent); color: var(--foreground); }
.ibtn.xs { width: 24px; height: 24px; }
.ibtn[aria-pressed="true"] { background: var(--accent); color: var(--foreground); }
.ibtn:disabled { opacity: .64; pointer-events: none; }
.kbd {
  display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 4px;
  border: 1px solid var(--border); background: var(--muted); font: 11px var(--font-mono); color: var(--subtle-foreground);
}
.btn.primary .kbd { height: 18px; background: transparent; border-color: color-mix(in oklab, var(--primary-foreground) 25%, transparent); color: inherit; opacity: .8; }

.seg {
  display: inline-flex; align-items: center; gap: 2px; height: 32px; padding: 2px; border-radius: 10px;
  border: 1px solid color-mix(in oklab, var(--border) 80%, transparent); background: var(--background);
}
.seg button {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 8px;
  font-size: 12px; font-weight: 500; color: var(--muted-foreground); transition: background-color .15s, color .15s;
}
.seg button:hover { background: color-mix(in oklab, var(--accent) 60%, transparent); color: var(--foreground); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--foreground); }
.seg.sm { height: 26px; border-radius: 8px; }
.seg.sm button { height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11.5px; }

.chip {
  display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 4px; flex: none;
  border: 1px solid color-mix(in oklab, var(--border) 70%, transparent);
  background: color-mix(in oklab, var(--muted) 55%, transparent);
  font-size: 11px; color: var(--subtle-foreground); white-space: nowrap;
}
.chip.mono { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0; }
.chip.warn { background: color-mix(in oklab, var(--warning) 10%, transparent); border-color: transparent; color: var(--warning-foreground); font-weight: 500; }
.chip.bad { background: color-mix(in oklab, var(--destructive) 10%, transparent); border-color: transparent; color: var(--destructive-foreground); font-weight: 500; }
.count { border-radius: 8px; background: var(--muted); padding: 1px 6px; font-size: 12px; font-weight: 500; color: var(--subtle-foreground); }

.panel { border: 1px solid var(--border); border-radius: 14px; background: var(--card); box-shadow: 0 1px 2px rgb(0 0 0 / .05); overflow: hidden; }
.panel-h { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--border); color: var(--muted-foreground); }
.panel-t { font-size: 14px; font-weight: 500; color: var(--foreground); }
.panel-note { font-size: 12px; color: var(--muted-foreground); }
.panel-f { padding: 10px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); display: flex; flex-direction: column; gap: 6px; }
.panel-f p { margin: 0; display: flex; gap: 6px; align-items: flex-start; }
.panel-f p .i { margin-top: 2px; }

/* ---------- Query tab ---------- */
.subnav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.qbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.qbar .lbl2 { font-size: 12px; color: var(--muted-foreground); margin-left: 4px; }
.q-grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start; }
@media (max-width: 1180px) { .q-grid { grid-template-columns: minmax(0, 1fr); } .side { position: static !important; max-height: none !important; } }
.pipeline { container-type: inline-size; min-width: 0; }
.side { position: sticky; top: 0; display: flex; flex-direction: column; gap: 16px; max-height: calc(100vh - 124px); min-height: 0; }
.side .sql-panel { display: flex; flex-direction: column; min-height: 0; flex: 1; }

/* Stage card */
.st {
  border: 1px solid var(--border); border-radius: 14px; background: var(--card);
  box-shadow: 0 1px 2px rgb(0 0 0 / .05); transition: border-color .3s ease-out, opacity .15s;
}
.st.hl { border-color: color-mix(in oklab, var(--ring) 75%, transparent); }
.st.dragging { opacity: .4; }
.st.drop-before { box-shadow: 0 -3px 0 -1px var(--foreground); }
.st.drop-after { box-shadow: 0 3px 0 -1px var(--foreground); }
.st-h { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 6px 0 4px; }
.st:not(.collapsed):not(.off) .st-h { border-bottom: 1px solid var(--border); }
.st.off .st-h > :not(.st-actions) { opacity: .5; }
.st.off .st-body, .st.collapsed .st-body { display: none; }
.grip { display: flex; align-items: center; justify-content: center; width: 16px; height: 28px; color: var(--muted-foreground); cursor: grab; opacity: 0; transition: opacity .15s; }
.st:hover .grip { opacity: 1; }
.st-n { font: 500 11px var(--font-mono); color: var(--subtle-foreground); min-width: 14px; text-align: center; }
.st-ic { color: var(--muted-foreground); }
.st-title { font-size: 14px; font-weight: 500; white-space: nowrap; }
.st-clause { display: flex; gap: 4px; }
.st-sum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px var(--font-mono); color: var(--muted-foreground); }
.st-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; white-space: nowrap; }
.st-meta .delta { font: 11px var(--font-mono); color: var(--subtle-foreground); }
.st-actions { display: flex; align-items: center; gap: 1px; }
.st-b { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); }
@container (max-width: 780px) {
  .st-b { grid-template-columns: minmax(0, 1fr); }
  .st-b .pv { border-left: 0; border-top: 1px solid var(--border); }
}
.conn { position: relative; height: 22px; }
.conn::before { content: ""; position: absolute; left: 27px; top: 0; bottom: 0; border-left: 1px solid var(--border); }
.conn-add { position: absolute; left: 16px; top: 0; width: 22px; height: 22px; border-radius: 6px; opacity: 0; background: var(--background); border: 1px solid var(--border); }
.conn:hover .conn-add, .conn-add:focus-visible { opacity: 1; }
.add-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.add-hint { font-size: 12px; color: var(--muted-foreground); }

/* Editor */
.ed { padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.sub { font-size: 12px; color: var(--muted-foreground); }
.sub + .row, .row + .sub { margin-top: 0; }
.kw { font-size: 12px; color: var(--muted-foreground); }
.hint { margin: 0; font-size: 12px; color: var(--muted-foreground); line-height: 16px; }
.hint code { font-size: 11.5px; color: var(--foreground); }
.tok {
  display: inline-flex; align-items: center; gap: 4px; height: 26px; max-width: 100%; padding: 0 5px 0 8px;
  border: 1px solid var(--input); border-radius: 6px; background: transparent;
  font: 12.5px var(--font-mono); color: var(--foreground); white-space: nowrap; transition: background-color .15s, border-color .15s;
}
.tok:hover { background: var(--accent); }
.tok .i { color: var(--muted-foreground); }
.tok .tl { overflow: hidden; text-overflow: ellipsis; }
.rel { color: var(--muted-foreground); }
.tok-op { font-family: var(--font-sans); color: var(--foreground); }
.tok-fn { font-family: var(--font-sans); font-weight: 500; }
.tok-empty { border-style: dashed; color: var(--muted-foreground); font-family: var(--font-sans); }
.tok-bad { border-color: color-mix(in oklab, var(--destructive) 40%, transparent); color: var(--destructive-foreground); }
.tin {
  height: 26px; min-width: 0; width: 140px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--input);
  background: color-mix(in oklab, var(--background) 60%, transparent); font: 12.5px var(--font-mono); color: var(--foreground);
  box-shadow: inset 0 1px 0 var(--edge); outline: none; transition: border-color .15s, box-shadow .15s;
}
.tin::placeholder { color: var(--muted-foreground); }
.tin:focus { border-color: var(--ring); box-shadow: 0 0 0 2px color-mix(in oklab, var(--ring) 40%, transparent); }
.tin.num { width: 76px; font-variant-numeric: tabular-nums; }
.tin.xs { width: 56px; }
.tin.alias { width: 64px; }
.tin.name { width: 150px; }
.tin.grow { flex: 1 1 88px; width: auto; max-width: 180px; }
.tin.wide, .tin.sqlin { flex: 1; min-width: 160px; width: auto; }
.tin[type="date"] { width: 136px; font-size: 12px; }
textarea.tin { height: auto; min-height: 84px; width: 100%; padding: 8px; line-height: 20px; resize: vertical; background: var(--code); }

.fgroup { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fgroup.nested { border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: color-mix(in oklab, var(--muted) 40%, transparent); flex: 1; }
.frow { display: flex; align-items: flex-start; gap: 6px; min-width: 0; }
.fbody { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.joiner { flex: none; width: 44px; height: 26px; display: inline-flex; align-items: center; font-size: 12px; color: var(--muted-foreground); }
button.joiner { justify-content: center; border-radius: 6px; border: 1px solid color-mix(in oklab, var(--border) 80%, transparent); font-family: var(--font-mono); font-size: 11.5px; color: var(--foreground); }
button.joiner:hover { background: var(--accent); }
.ffoot { display: flex; gap: 2px; margin-left: 44px; flex-wrap: wrap; }
.fgroup.nested .ffoot { margin-left: 44px; }
.del { opacity: .7; }
.frow:hover > .del, .row:hover > .del, .del:focus-visible { opacity: 1; }
.crow { display: flex; flex-direction: column; gap: 4px; padding-bottom: 8px; border-bottom: 1px dashed var(--border); }
.crow:last-of-type { border-bottom: 0; padding-bottom: 0; }
.cexpr { font: 11px var(--font-mono); color: var(--subtle-foreground); padding-left: 2px; overflow-wrap: anywhere; }
.cexpr:empty { display: none; }
.prow { display: grid; grid-template-columns: 20px minmax(0, 1fr) 120px 52px; align-items: center; gap: 6px; height: 30px; }
.prow .pname { font: 12.5px var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .ptype { font-size: 11px; color: var(--subtle-foreground); margin-left: 6px; }
.prow.gone .pname { color: var(--destructive-foreground); text-decoration: line-through; }
.prow .tin { width: 100%; }
.prow input[type="checkbox"] { width: 14px; height: 14px; margin: 0; accent-color: var(--primary); }
.plist { display: flex; flex-direction: column; max-height: 264px; overflow: auto; margin: 0 -4px; padding: 0 4px; }
.rel-list { display: flex; flex-direction: column; gap: 4px; }
.rel-btn {
  display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 8px; text-align: left;
  font-size: 12.5px; color: var(--muted-foreground); transition: background-color .15s, color .15s;
}
.rel-btn:hover { background: var(--accent); color: var(--foreground); }
.rel-btn .rt { font-family: var(--font-mono); color: var(--foreground); }
.rel-btn .rh { font-size: 11px; color: var(--subtle-foreground); }
.rel-btn .ra { margin-left: auto; font-size: 12px; opacity: 0; transition: opacity .15s; }
.rel-btn:hover .ra, .rel-btn:focus-visible .ra { opacity: 1; }

/* Preview grids */
.pv { border-left: 1px solid var(--border); min-width: 0; display: flex; flex-direction: column; }
.pv-scroll { overflow: auto; max-height: 236px; flex: 1; }
.pv-foot { padding: 7px 12px; border-top: 1px solid var(--border); font-size: 11px; color: var(--subtle-foreground); display: flex; gap: 8px; }
.pv-empty { padding: 20px 16px; font-size: 12px; color: var(--muted-foreground); display: flex; gap: 8px; align-items: flex-start; }
.grid { border-collapse: collapse; font: 12.5px/20px var(--font-mono); width: max-content; min-width: 100%; }
.grid th {
  position: sticky; top: 0; z-index: 1; background: var(--card); text-align: left; font-weight: 400;
  padding: 6px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: bottom;
}
.grid th .tn { color: var(--foreground); font-size: 12.5px; }

/* Row flow */
.flow { padding: 6px 0; }
.flow-row {

@media (prefers-reduced-motion: reduce) { * { transition-duration: 0s !important; } .btn:active { transform: none; } }

<script>
'use strict';

/* =====================================================================

const $ = (s, el = document) => el.querySelector(s);

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const DAY = 864e5;

const IS_MAC = /Mac/.test(navigator.platform);
const MOD = IS_MAC ? '⌘' : 'Ctrl';
const fmtInt = n => n.toLocaleString('en-US');
const NAME_RE = /^[a-z_][a-z0-9_]*$/i;

let seedV = 20260930;

const pick = a => a[Math.floor(rnd() * a.length)];
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
function wpick(pairs) {
  const total = pairs.reduce((s, p) => s + p[1], 0);
  let r = rnd() * total;
  for (const [v, w] of pairs) { r -= w; if (r < 0) return v; }
  return pairs[0][0];
}

function getPath(obj, path) { return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj); }

}

const ICONS = {
  table: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',
  join: '<circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/>',

  group: '<path d="M18 7V4H6l6 8-6 8h12v-3"/>',
  fx: '<path d="M9 20c2 0 2.6-2 3.1-5l1.4-8c.5-2.6 1.1-4 3.5-4"/><path d="M8 10h8"/>',
  columns: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/>',
  sort: '<path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/>',
  limit: '<path d="M4 6h16M4 12h16M4 18h7"/>',
  code: '<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  chevr: '<path d="m9 18 6-6-6-6"/>',
  chevl: '<path d="m15 18-6-6 6-6"/>',
  up: '<path d="m18 15-6-6-6 6"/>',
  grip: '<circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff: '<path d="m3 3 18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.9 8.3 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.3"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
  more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  play: '<path d="M7 4v16l13-8z"/>',
  copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  db: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/>',
  alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  key: '<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  terminal: '<path d="m4 17 6-6-6-6M12 19h8"/>',
  refresh: '<path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  dup: '<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16V4h12"/>',
  compass: '<circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.1 6.3-6.3 2.1 2.1-6.3z"/>',
  rows: '<path d="M3 5h18M3 12h18M3 19h18"/>',
  steps: '<path d="M4 4v6a2 2 0 0 0 2 2h14"/><path d="m16 8 4 4-4 4"/>',
};
function icon(name, size = 14) {
  return `<svg class="i" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
}

/* =====================================================================
   Schema + demo data (a fictional coffee roastery, "Ember & Oak")
   ===================================================================== */
function kindOf(type, opts) {
  if (opts.enum) return 'enum';
  if (/^(int|numeric)/.test(type)) return 'number';
  if (type === 'timestamptz') return 'time';
  if (type === 'bool') return 'bool';
  if (type === 'jsonb') return 'json';
  if (type.endsWith('[]')) return 'array';
  return 'text';
}
function C(name, type, opts = {}) { return { name, type, kind: kindOf(type, opts), ...opts }; }

const TABLES = {
  categories: { alias: 'cat', columns: [C('id', 'int8', { pk: true }), C('name', 'text'), C('slug', 'text')] },
  customers: { alias: 'c', columns: [
    C('id', 'int8', { pk: true }), C('email', 'text'), C('full_name', 'text'), C('country', 'text'),
    C('marketing_opt_in', 'bool'), C('created_at', 'timestamptz'),
  ] },
  order_items: { alias: 'oi', columns: [
    C('id', 'int8', { pk: true }), C('order_id', 'int8', { fk: ['orders', 'id'] }), C('product_id', 'int8', { fk: ['products', 'id'] }),
    C('quantity', 'int4'), C('unit_price_cents', 'int4'),
  ] },
  orders: { alias: 'o', columns: [
    C('id', 'int8', { pk: true }), C('customer_id', 'int8', { fk: ['customers', 'id'] }),
    C('status', 'order_status', { enum: ['pending', 'paid', 'shipped', 'delivered', 'refunded', 'cancelled'] }),
    C('total_cents', 'int4'), C('currency', 'text'), C('created_at', 'timestamptz'),
    C('shipped_at', 'timestamptz', { nullable: true }), C('metadata', 'jsonb', { keys: ['channel', 'coupon', 'gift'] }),
  ] },
  products: { alias: 'p', columns: [
    C('id', 'int8', { pk: true }), C('sku', 'text'), C('name', 'text'), C('category_id', 'int8', { fk: ['categories', 'id'] }),
    C('price_cents', 'int4'), C('roast', 'roast_level', { enum: ['light', 'medium', 'dark'], nullable: true }),
    C('tags', 'text[]'), C('is_active', 'bool'),
  ] },
  subscriptions: { alias: 's', columns: [
    C('id', 'int8', { pk: true }), C('customer_id', 'int8', { fk: ['customers', 'id'] }),
    C('cadence', 'sub_cadence', { enum: ['weekly', 'fortnightly', 'monthly'] }),
    C('started_at', 'timestamptz'), C('cancelled_at', 'timestamptz', { nullable: true }),
  ] },
};
const TABLE_ORDER = Object.keys(TABLES);

function genData() {
  const cats = [['Coffee', 'coffee'], ['Brewing gear', 'brewing-gear'], ['Merch', 'merch'], ['Gift cards', 'gift-cards']];
  TABLES.categories.data = cats.map(([name, slug], i) => ({ id: i + 1, name, slug }));

  const prods = [
    ['Kiln espresso', 1, 1800, 'dark', ['espresso', 'bestseller']],
    ['Morning fog blend', 1, 1600, 'medium', ['filter']],
    ['Ridgeline Ethiopia', 1, 2100, 'light', ['single-origin', 'filter']],
    ['Night shift decaf', 1, 1700, 'dark', ['decaf']],
    ['Harbour house blend', 1, 1500, 'medium', ['espresso', 'filter']],
    ['Copper kettle', 2, 6400, null, ['kettle']],
    ['Pour-over dripper', 2, 2800, null, ['filter']],
    ['Burr grinder', 2, 14900, null, ['grinder', 'bestseller']],
    ['Paper filters (100)', 2, 700, null, ['filter']],
    ['Enamel mug', 3, 2200, null, ['mug']],
    ['Canvas tote', 3, 1900, null, []],
    ['Roaster cap', 3, 2500, null, []],
    ['Gift card 25', 4, 2500, null, ['gift']],
    ['Gift card 50', 4, 5000, null, ['gift']],
  ];
  TABLES.products.data = prods.map((p, i) => ({
    id: i + 1, sku: `EO-${1000 + i * 7}`, name: p[0], category_id: p[1], price_cents: p[2], roast: p[3], tags: p[4], is_active: i !== 11,
  }));

  const first = ['Aarav', 'Maya', 'Noah', 'Priya', 'Liam', 'Hana', 'Oliver', 'Zara', 'Kenji', 'Ava', 'Mateo', 'Isla', 'Ravi', 'Sofia', 'Finn', 'Leila', 'Arjun', 'Nora', 'Theo', 'Mei', 'Jonas', 'Elif', 'Diego', 'Amara'];
  const last = ['Shah', 'Okafor', 'Müller', 'Tanaka', 'Walsh', 'Iyer', 'Bennett', 'Novak', 'Costa', 'Lindqvist', 'Reyes', 'Haddad', 'Kim', 'Fischer', 'Nair', 'Brooks', 'Sato', 'Moreau', 'Kapoor', 'Evans'];
  const countries = [['US', 30], ['IN', 18], ['GB', 14], ['DE', 10], ['JP', 8], ['AU', 7], ['CA', 7], ['NL', 6]];
  const currency = { US: 'USD', IN: 'INR', GB: 'GBP', DE: 'EUR', JP: 'JPY', AU: 'AUD', CA: 'CAD', NL: 'EUR' };
  const ascii = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  const customers = [];
  for (let i = 0; i < 140; i++) {
    const f = pick(first), l = pick(last);
    customers.push({
      id: i + 1, email: `${ascii(f)}.${ascii(l)}${i + 1}@example.com`, full_name: `${f} ${l}`, country: wpick(countries),
      marketing_opt_in: rnd() < 0.55, created_at: TODAY - ri(30, 900) * DAY - ri(0, 86399) * 1000,
    });
  }
  TABLES.customers.data = customers;

  const prodWeights = TABLES.products.data.map(p => [p, [0, 6, 1.6, 1, 0.6][p.category_id]]);
  const raw = [];
  for (let i = 0; i < 900; i++) {
    const cust = customers[Math.min(139, Math.floor(Math.pow(rnd(), 1.7) * 140))];
    const age = Math.floor(Math.pow(rnd(), 1.3) * 540);
    const created = TODAY - age * DAY - ri(0, 11 * 3600) * 1000;
    let status;
    if (age < 2) status = wpick([['pending', 1], ['paid', 2]]);
    else if (age < 10) status = wpick([['paid', 1], ['shipped', 3], ['delivered', 2], ['cancelled', 0.3]]);
    else status = wpick([['delivered', 84], ['refunded', 5], ['cancelled', 7], ['shipped', 1]]);
    const items = [];
    const n = wpick([[1, 45], [2, 30], [3, 17], [4, 8]]);
    for (let k = 0; k < n; k++) {
      const p = wpick(prodWeights);
      items.push({ product_id: p.id, quantity: wpick([[1, 70], [2, 22], [3, 8]]), unit_price_cents: rnd() < 0.1 ? Math.round(p.price_cents * 0.9) : p.price_cents });
    }
    const total = items.reduce((s, it) => s + it.quantity * it.unit_price_cents, 0);
    let shipped = (status === 'shipped' || status === 'delivered') ? created + ri(1, 4) * DAY + ri(0, 20) * 3600e3 : null;
    if (shipped && shipped > TODAY) shipped = TODAY - 3600e3;
    raw.push({
      cust, created, status, items, total, shipped,
      meta: { channel: wpick([['web', 60], ['app', 30], ['wholesale', 10]]), coupon: rnd() < 0.18 ? pick(['BREW10', 'FIRSTCUP', 'WINTER25']) : null, gift: rnd() < 0.08 },
    });
  }
  raw.sort((a, b) => a.created - b.created);
  const orders = [], orderItems = [];
  raw.forEach((r, i) => {
    const id = i + 1;
    orders.push({ id, customer_id: r.cust.id, status: r.status, total_cents: r.total, currency: currency[r.cust.country], created_at: r.created, shipped_at: r.shipped, metadata: r.meta });
    r.items.forEach(it => orderItems.push({ id: orderItems.length + 1, order_id: id, ...it }));
  });
  TABLES.orders.data = orders;
  TABLES.order_items.data = orderItems;

  const subs = [], used = new Set();
  while (subs.length < 56) {
    const c = pick(customers);
    if (used.has(c.id)) continue;
    used.add(c.id);
    const start = TODAY - ri(10, 600) * DAY;
    const cancelled = rnd() < 0.3 ? Math.min(TODAY - DAY, start + ri(20, 300) * DAY) : null;
    subs.push({ id: subs.length + 1, customer_id: c.id, cadence: wpick([['weekly', 2], ['fortnightly', 3], ['monthly', 5]]), started_at: start, cancelled_at: cancelled });
  }
  TABLES.subscriptions.data = subs;
}

const rowCache = new Map();
function baseRows(table, alias) {
  const key = `${table}:${alias}`;
  if (!rowCache.has(key)) {
    const cols = TABLES[table].columns;
    rowCache.set(key, TABLES[table].data.map(r => {
      const o = {};
      for (const c of cols) o[`${alias}.${c.name}`] = r[c.name];
      return o;
    }));
  }
  return rowCache.get(key);
}

/* A field is one column flowing through the pipeline. Rows are keyed by field id;
   `sql` is how the current SELECT refers to it (it changes when a CTE step wraps). */
function tableFields(table, alias, origin) {
  return TABLES[table].columns.map(c => ({
    id: `${alias}.${c.name}`, name: c.name, rel: alias, table, kind: c.kind, pgType: c.type,
    enumVals: c.enum, keys: c.keys, fk: c.fk, pk: c.pk, sql: `${alias}.${c.name}`, origin, base: true,
  }));

// Resolve a computed column against the fields it can see.
function computeCol(c, F) {
  const fn = FUNCS[c.fn];
  if (!fn) return { incomplete: true };
  if (!NAME_RE.test(c.as || '')) return { error: `"${c.as}" isn't a valid column name. Use letters, numbers and underscores.` };
  const sx = {}, get = {}, kinds = {};
  let win = !!fn.win;
  for (const a of fn.args) {
    const v = c.args[a.k];
    if (a.t === 'field' || a.t === 'field?') {
      if (!v) {
        if (a.t === 'field') return { incomplete: true };
        sx[a.k] = null; get[a.k] = null;
        continue;
      }
      const f = F.get(v);
      sx[a.k] = f.sql; get[a.k] = r => r[f.id]; kinds[a.k] = f.kind;
      if (f.win) win = true;
    } else if (a.t === 'operand') {
      if (!v) return { incomplete: true };
      if (v.f) {
        const f = F.get(v.f);
        sx[a.k] = f.sql; get[a.k] = r => r[f.id]; kinds[a.k] = f.kind;
        if (f.win) win = true;
      } else {
        const val = v.n ?? v.s;
        sx[a.k] = v.n != null ? String(v.n) : lit(v.s);
        get[a.k] = () => val;
        kinds[a.k] = v.n != null ? 'number' : 'text';
      }
    } else {
      if (v == null || v === '') return { incomplete: true };
      sx[a.k] = v; get[a.k] = () => v;
    }
  }
  const kind = typeof fn.out === 'function' ? (fn.out(kinds) || 'text') : fn.out;
  return { fn, sql: fn.sql(sx), win, kind, get, kinds };
}

  switch (type) {
    case 'join': {
      const s = extra || null;
      return mkStage('join', { table: s ? s.table : null, alias: s ? uniqueAlias(s.table, inFields) : '', how: 'inner', on: [{ l: s ? s.l : null, r: s ? s.r : null }] });
    }
    case 'filter': return mkStage('filter', { where: { k: 'group', op: 'and', items: [emptyCond()] } });
    case 'group': return mkStage('group', { keys: [{ id: uid('k'), field: null, bucket: null }], aggs: [{ id: uid('a'), fn: 'count', field: null, as: 'count', asAuto: true }] });
    case 'compute': return mkStage('compute', { cols: [{ id: uid('x'), as: 'new_column', asAuto: true, fn: null, args: {} }] });
    case 'project': return mkStage('project', { cols: inFields.map(f => ({ field: f.id, as: '', on: true })) });
    case 'sort': return mkStage('sort', { keys: [{ field: null, dir: 'asc', nulls: 'default' }] });
    case 'limit': return mkStage('limit', { limit: 50, offset: 0 });
    case 'sql': return mkStage('sql', { sql: 'SELECT *\nFROM prev' });
  }
}

function exampleStages() {
  if (state.table !== 'orders') return [];
  const kMonth = uid('k'), aOrders = uid('a'), aRev = uid('a'), aCust = uid('a'), xRank = uid('x');
  return [
    mkStage('join', { table: 'customers', alias: 'c', how: 'inner', on: [{ l: 'o.customer_id', r: 'id' }] }),
    mkStage('filter', { where: { k: 'group', op: 'and', items: [
      { k: 'cond', field: 'o.status', op: 'in', value: ['paid', 'shipped', 'delivered'] },
      { k: 'cond', field: 'o.created_at', op: 'last', value: { n: 12, unit: 'months' } },
    ] } }),
    mkStage('group', {
      keys: [{ id: uid('k'), field: 'c.country', bucket: null }, { id: kMonth, field: 'o.created_at', bucket: 'month' }],
      aggs: [
        { id: aOrders, fn: 'count', field: null, as: 'orders' },
        { id: aRev, fn: 'sum', field: 'o.total_cents', as: 'revenue_cents' },
        { id: aCust, fn: 'count_distinct', field: 'c.id', as: 'customers' },
      ],
    }),
    mkStage('filter', { where: { k: 'group', op: 'and', items: [{ k: 'cond', field: aOrders, op: 'gte', value: '3' }] } }),
    mkStage('compute', { cols: [{ id: xRank, as: 'rank_in_month', fn: 'rank', args: { part: kMonth, order: aRev, dir: 'desc' } }] }),
    mkStage('filter', { where: { k: 'group', op: 'and', items: [{ k: 'cond', field: xRank, op: 'lte', value: '3' }] } }),
    mkStage('sort', { keys: [{ field: kMonth, dir: 'desc', nulls: 'default' }, { field: xRank, dir: 'asc', nulls: 'default' }] }),
  ];
}

function walk(node, fn) { fn(node); if (node.k === 'group') node.items.forEach(n => walk(n, fn)); }

function refsOf(st) {
  const ids = [];
  const add = v => { if (v) ids.push(v); };
  switch (st.type) {
    case 'join': st.on.forEach(p => add(p.l)); break;
    case 'filter': walk(st.where, n => { if (n.k === 'cond') add(n.field); }); break;
    case 'group': st.keys.forEach(k => add(k.field)); st.aggs.forEach(a => add(a.field)); break;
    case 'compute':
      st.cols.forEach(c => {
        const fn = FUNCS[c.fn];
        if (!fn) return;
        fn.args.forEach(a => {
          const v = c.args[a.k];
          if (a.t === 'field' || a.t === 'field?') add(v);
          if (a.t === 'operand' && v && v.f) add(v.f);
        });
      });
      break;
    case 'sort': st.keys.forEach(k => add(k.field)); break;
  }
  return ids;
}

/* ---------- Filter trees ---------- */
function condComplete(n, F) {
  const f = F.get(n.field);
  const o = f && opOf(f, n.op);
  return !!o && valueOk(o.v, n.value);
}
function isWrapped(s) {
  if (s[0] !== '(') return false;
  let depth = 0;
  for (let i = 0; i < s.length; i++) {
    if (s[i] === '(') depth++;
    if (s[i] === ')') depth--;
    if (depth === 0 && i < s.length - 1) return false;
  }
  return true;
}
const wrapIfLogic = s => (/\s(AND|OR)\s/i.test(s) && !isWrapped(s) ? `(${s})` : s);
function condSql(n, F) {
  if (n.k === 'raw') return n.sql.trim() || null;
  if (n.k === 'cond') {
    if (!condComplete(n, F)) return null;
    const f = F.get(n.field);
    return opOf(f, n.op).sql(f.sql, n.value);
  }
  const parts = n.items.map(x => condSql(x, F)).filter(Boolean);
  if (!parts.length) return null;
  if (parts.length === 1) return parts[0];
  return parts.map(wrapIfLogic).join(n.op === 'and' ? ' AND ' : ' OR ');
}
// Top-level AND conditions become separate WHERE lines, so each reads on its own.
function filterEntries(root, F) {
  if (root.op === 'and') return root.items.map(n => condSql(n, F)).filter(Boolean);
  const s = condSql(root, F);
  return s ? [s] : [];
}
function condTest(n, F) {
  if (n.k === 'raw') return null;
  if (n.k === 'cond') {
    if (!condComplete(n, F)) return null;
    const f = F.get(n.field), o = opOf(f, n.op);
    return r => o.test(r[f.id], n.value);
  }
  const fns = n.items.map(x => condTest(x, F)).filter(Boolean);
  if (!fns.length) return null;
  return n.op === 'and' ? r => fns.every(fn => fn(r)) : r => fns.some(fn => fn(r));
}
function filterHasContent(root, F) {
  let ok = false;
  walk(root, n => {
    if (n.k === 'raw' && n.sql.trim()) ok = true;
    if (n.k === 'cond' && condComplete(n, F)) ok = true;
  });
  return ok;
}
function valText(v, val) {
  switch (v) {
    case 'none': return '';
    case 'list': case 'enum': return ` ${val.join(', ')}`;
    case 'duration': return ` ${val.n} ${val.unit}`;
    case 'range': case 'daterange': return ` ${val.a} and ${val.b}`;
    case 'jsonkv': return ` ${val.key} = ${val.val}`;
    default: return ` ${val}`;
  }
}
function condText(n, F, top) {
  if (n.k === 'raw') return n.sql.trim();
  if (n.k === 'cond') {
    if (!condComplete(n, F)) return '';
    const f = F.get(n.field), o = opOf(f, n.op);
    return `${f.name} ${o.label}${valText(o.v, n.value)}`;
  }
  const parts = n.items.map(x => condText(x, F, false)).filter(Boolean);
  const s = parts.join(` ${n.op} `);
  return !top && parts.length > 1 ? `(${s})` : s;
}

function incompleteReason(st, F) {
  switch (st.type) {
    case 'join':
      if (!st.table) return 'Choose a table to join.';
      if (!st.on[0].l || !st.on[0].r) return 'Choose the columns to match on.';
      return null;
    case 'filter': return filterHasContent(st.where, F) ? null : 'Add a condition to filter rows.';
    case 'group': return st.keys.some(k => k.field) || st.aggs.some(a => AGGS[a.fn].noField || a.field) ? null : 'Choose a column to group by.';
    case 'compute': return st.cols.some(c => !computeCol(c, F).incomplete) ? null : 'Choose a function for the new column.';
    case 'project': return st.cols.some(c => c.on && F.has(c.field)) ? null : 'Pick at least one column.';
    case 'sort': return st.keys.some(k => k.field) ? null : 'Choose a column to sort by.';
    case 'limit': return Number.isInteger(st.limit) && st.limit >= 0 ? null : 'Enter how many rows to keep.';
    case 'sql': return st.sql.trim() ? null : 'Write a query. Use prev for the rows above.';
  }
  return null;
}

/* =====================================================================
   Evaluate one stage against the rows flowing into it
   ===================================================================== */
function evalStage(st, fields, rows, F) {
  switch (st.type) {
    case 'join': {
      const T = TABLES[st.table];
      const alias = st.alias;
      if (!NAME_RE.test(alias)) return { error: 'The alias must be a simple name, like c or cust.' };
      if (fields.some(f => f.rel === alias)) return { error: `The alias ${alias} is already used above. Pick another one.` };
      const p = st.on[0];
      const right = baseRows(st.table, alias);
      const rkey = `${alias}.${p.r}`;
      const index = new Map();
      for (const r of right) {
        const k = r[rkey];
        if (k == null) continue;
        if (!index.has(k)) index.set(k, []);
        index.get(k).push(r);
      }
      const nullRow = Object.fromEntries(T.columns.map(c => [`${alias}.${c.name}`, null]));
      const out = [];
      let unmatched = 0;
      for (const l of rows) {
        const matches = index.get(l[p.l]);
        if (matches) { for (const r of matches) out.push({ ...l, ...r }); continue; }
        unmatched++;
        if (st.how === 'left') out.push({ ...l, ...nullRow });
      }
      let warn = null, note = null;
      if (out.length > rows.length) {
        warn = `Rows repeat: each input row matched about ${(out.length / Math.max(1, rows.length - unmatched)).toFixed(1)} ${st.table} rows. Sums over earlier columns will count them more than once.`;
      }
      if (unmatched && st.how === 'inner') note = `${fmtInt(unmatched)} rows had no matching ${st.table} row and were dropped. Switch to Left to keep them.`;
      return { fields: [...fields, ...tableFields(st.table, alias, st.id)], rows: out, warn, note };
    }
    case 'filter': {
      const test = condTest(st.where, F);
      let hasRaw = false;
      walk(st.where, n => { if (n.k === 'raw' && n.sql.trim()) hasRaw = true; });
      return { fields, rows: test ? rows.filter(test) : rows, note: hasRaw ? 'SQL conditions aren’t applied to previews in this prototype. The app would run them in Postgres.' : null };
    }
    case 'group': {
      const keys = st.keys.filter(k => k.field);
      const aggs = st.aggs.filter(a => AGGS[a.fn].noField || a.field);
      for (const a of aggs) if (!NAME_RE.test(a.as || '')) return { error: `"${a.as}" isn't a valid column name. Use letters, numbers and underscores.` };
      const keyFields = keys.map(k => {
        const f = F.get(k.field);
        if (!k.bucket) return { ...f, origin: st.id };
        return { id: k.id, name: `${f.name}_${k.bucket}`, rel: null, kind: 'time', pgType: 'timestamptz', sql: `date_trunc('${k.bucket}', ${f.sql})`, origin: st.id };
      });
      const aggFields = aggs.map(a => {
        const f = a.field ? F.get(a.field) : null;
        const def = AGGS[a.fn];
        return { id: a.id, name: a.as, rel: null, kind: def.kind(f), elemKind: f && f.kind, pgType: def.pg(f), sql: def.sql(f && f.sql), agg: true, origin: st.id };
      });
      const groups = new Map();
      for (const r of rows) {
        const kv = keys.map(k => (k.bucket ? truncTime(r[k.field], k.bucket) : r[k.field]));
        const key = JSON.stringify(kv);
        if (!groups.has(key)) groups.set(key, { kv, rows: [] });
        groups.get(key).rows.push(r);
      }
      if (!keys.length && !groups.size) groups.set('[]', { kv: [], rows: [] });
      const out = [...groups.values()].map(g => {
        const row = {};
        keyFields.forEach((f, i) => { row[f.id] = g.kv[i]; });
        aggs.forEach(a => { row[a.id] = AGGS[a.fn].ev(g.rows.map(r => r[a.field]), g.rows); });
        return row;
      });
      return { fields: [...keyFields, ...aggFields], rows: out };
    }
    case 'compute': {
      const added = [];
      const exprs = {};
      let unevaluated = false;
      for (const c of st.cols) {
        const r = computeCol(c, F);
        if (r.error) return { error: r.error };
        if (r.incomplete) continue;
        let vals = null;
        if (r.fn.all) vals = r.fn.all(rows, r.get);
        else if (r.fn.ev) {
          vals = rows.map(row => {
            const x = {};
            for (const k in r.get) x[k] = r.get[k] ? r.get[k](row) : null;
            return r.fn.ev(x, r.kinds);
          });
        } else unevaluated = true;
        exprs[c.id] = r.sql;
        const f = { id: c.id, name: c.as, rel: null, kind: r.kind, pgType: r.fn.win && r.fn.out === 'number' && c.fn !== 'pct' && c.fn !== 'running' ? 'int8' : pgOf(r.kind), sql: r.fn.paren ? `(${r.sql})` : r.sql, win: r.win, origin: st.id };
        added.push({ f, vals });
      }
      const out = rows.map((row, i) => {
        const o = { ...row };
        for (const a of added) o[a.f.id] = a.vals ? a.vals[i] : undefined;
        return o;
      });
      return { fields: [...fields, ...added.map(a => a.f)], rows: out, exprs, note: unevaluated ? 'SQL expressions aren’t evaluated in this prototype. The app would compute them in Postgres.' : null };
    }
    case 'project': {
      const out = [];
      let missing = 0;
      for (const c of st.cols) {
        if (!c.on) continue;
        const f = F.get(c.field);
        if (!f) { missing++; continue; }
        const as = (c.as || '').trim();
        if (as && !NAME_RE.test(as)) return { error: `"${as}" isn't a valid column name. Use letters, numbers and underscores.` };
        out.push(as && as !== f.name ? { ...f, name: as, out: undefined, renamed: true, selStage: st.id } : f);
      }
      return { fields: out, rows, warn: missing ? `${missing} picked ${missing === 1 ? 'column is' : 'columns are'} no longer available above.` : null };
    }
    case 'sort': {
      const keys = st.keys.filter(k => k.field).map(k => ({ id: k.field, dir: k.dir === 'desc' ? -1 : 1, nulls: k.nulls }));
      const out = rows.slice().sort((a, b) => {
        for (const k of keys) {
          const c = cmpNulls(a[k.id], b[k.id], k.dir, k.nulls);
          if (c) return c;
        }
        return 0;
      });
      return { fields, rows: out };
    }
    case 'limit': {
      const off = Number(st.offset) || 0;
      return { fields, rows: rows.slice(off, off + st.limit) };
    }
  }
  return { fields, rows };
}

/* =====================================================================
   SQL compiler: stages fill one SELECT until one can't fit, then the
   stages above become a CTE step and a new SELECT starts from it.
   ===================================================================== */
function newBlock(from, fromStage, start, fromCte) {
  return { from, fromStage, start, fromCte, joins: [], where: [], groupBy: null, having: [], orderBy: null, limit: null,
    grouped: false, win: false, projected: false, sorted: false, limited: false, touched: false };
}

function breakReason(b, st, F) {
  const usesWin = refsOf(st).some(id => F.get(id) && F.get(id).win);
  const winStage = st.type === 'compute' && st.cols.some(c => FUNCS[c.fn] && FUNCS[c.fn].win);
  switch (st.type) {
    case 'join':
      if (b.limited) return 'it joins after a limit';
      if (b.grouped) return 'it joins after grouping';
      if (b.win) return 'it joins after a window function';
      if (b.projected) return 'it joins after columns were picked';
      if (b.sorted) return 'it joins after a sort';
      return null;
    case 'filter':
      if (b.limited) return 'it filters after a limit';
      if (usesWin) return 'SQL can’t filter on a window function in the same SELECT';
      return null;
    case 'group':
      if (b.limited) return 'it groups after a limit';
      if (b.grouped) return 'it groups rows that were already grouped';
      if (b.win || usesWin) return 'it groups after a window function';
      if (b.sorted) return 'it groups after a sort';
      return null;
    case 'compute':
      if (winStage && b.limited) return 'a window function after a limit needs the limited rows first';
      if (winStage && usesWin) return 'a window function can’t use another window function’s result';
      return null;
    case 'sort': return b.limited ? 'it sorts after a limit' : null;
    case 'limit': return b.limited ? 'it limits rows that were already limited' : null;
  }
  return null;
}

function emitStage(b, st, F) {
  b.touched = true;
  switch (st.type) {
    case 'join': {
      const p = st.on[0];
      b.joins.push({ s: st.id, t: `${st.how === 'left' ? 'LEFT JOIN' : 'JOIN'} public.${st.table} ${st.alias} ON ${st.alias}.${p.r} = ${F.get(p.l).sql}` });
      return st.how === 'left' ? 'LEFT JOIN' : 'JOIN';
    }
    case 'filter': {
      const target = b.grouped ? b.having : b.where;
      filterEntries(st.where, F).forEach(t => target.push({ s: st.id, t }));
      return b.grouped ? 'HAVING' : 'WHERE';
    }
    case 'group': {
      b.grouped = true;
      const keys = st.keys.filter(k => k.field).map(k => (k.bucket ? `date_trunc('${k.bucket}', ${F.get(k.field).sql})` : F.get(k.field).sql));
      if (keys.length) b.groupBy = { s: st.id, t: `GROUP BY ${keys.join(', ')}` };
      return 'GROUP BY';
    }
    case 'compute': {
      const win = st.cols.some(c => FUNCS[c.fn] && FUNCS[c.fn].win);
      if (win) b.win = true;
      return win ? 'OVER' : 'SELECT';
    }
    case 'project': b.projected = true; return 'SELECT';
    case 'sort': {
      // A later sort wins; earlier keys stay as tie-breakers, which is what a stable re-sort does.
      const keys = st.keys.filter(k => k.field).map(k => ({ field: F.get(k.field), dir: k.dir, nulls: k.nulls }));
      const kept = b.orderBy ? b.orderBy.keys.filter(o => !keys.some(k => k.field.id === o.field.id)) : [];
      b.orderBy = { s: st.id, keys: [...keys, ...kept] };
      b.sorted = true;
      return 'ORDER BY';
    }
    case 'limit':
      b.limit = { s: st.id, n: st.limit, off: Number(st.offset) || 0 };
      b.limited = true;
      return 'LIMIT';
  }
  return '';
}

function outNames(fields, dedupe) {
  const used = new Set(), names = new Map();
  for (const f of fields) {
    let n = f.out || f.name;
    if (dedupe && used.has(n)) {
      n = f.rel ? `${f.rel}_${f.name}` : `${f.name}_2`;
      let k = 2;
      while (used.has(n)) n = `${f.name}_${++k}`;
    }
    used.add(n);
    names.set(f.id, n);
  }
  return names;
}

function selectItems(fields, names) {
  const items = [];
  let i = 0;
  while (i < fields.length) {
    const f = fields[i];
    // Collapse a complete, untouched run of a table's columns into alias.*
    if (f.base && !f.renamed && !f.cte) {
      const cols = TABLES[f.table].columns;
      const run = fields.slice(i, i + cols.length);
      const full = run.length === cols.length && run.every((g, j) => g.base && !g.renamed && !g.cte && g.rel === f.rel && g.name === cols[j].name && names.get(g.id) === g.name);
      if (full) { items.push({ t: `${f.rel}.*`, s: f.origin }); i += cols.length; continue; }
    }
    const out = names.get(f.id);
    const plain = f.sql === qi(out) || f.sql.endsWith(`.${qi(out)}`);
    items.push({ t: plain ? f.sql : `${f.sql} AS ${qi(out)}`, s: f.selStage || (f.cte ? null : f.origin) });
    i++;
  }
  return items;
}

function renderBlock(b, fields, names) {
  const L = [];
  const items = selectItems(fields, names);
  const flat = items.map(it => it.t).join(', ');
  if (items.length === 1 || flat.length <= 64) L.push({ t: `SELECT ${flat}`, s: items.length === 1 ? items[0].s : null });
  else {
    L.push({ t: 'SELECT', s: null });
    items.forEach((it, i) => L.push({ t: `  ${it.t}${i < items.length - 1 ? ',' : ''}`, s: it.s }));
  }
  L.push({ t: `FROM ${b.from}`, s: b.fromStage });
  b.joins.forEach(j => L.push(j));
  const pushList = (kw, list) => list.forEach((e, i) => {
    const t = list.length > 1 && /\sOR\s/i.test(e.t) && !isWrapped(e.t) ? `(${e.t})` : e.t;
    L.push({ t: `${i === 0 ? kw : '  AND'} ${t}`, s: e.s });
  });
  pushList('WHERE', b.where);
  if (b.groupBy) L.push(b.groupBy);
  pushList('HAVING', b.having);
  if (b.orderBy) {
    const keys = b.orderBy.keys.map(k => {
      const f = fields.find(x => x.id === k.field.id);
      const useAlias = f && !f.base && !f.cte && (f.agg || f.origin);
      const ref = useAlias ? qi(names.get(f.id)) : k.field.sql;
      const nulls = k.nulls === 'first' ? ' NULLS FIRST' : k.nulls === 'last' ? ' NULLS LAST' : '';
      return `${ref}${k.dir === 'desc' ? ' DESC' : ''}${nulls}`;
    });
    L.push({ t: `ORDER BY ${keys.join(', ')}`, s: b.orderBy.s });
  }
  if (b.limit) L.push({ t: `LIMIT ${b.limit.n}${b.limit.off ? ` OFFSET ${b.limit.off}` : ''}`, s: b.limit.s });
  return L;
}

/* =====================================================================
   Analyze: evaluate + compile the whole pipeline in one pass
   ===================================================================== */
function analyze() {
  const T = TABLES[state.table];
  const alias = T.alias;
  const res = { st: {}, ctes: [], notes: [], known: new Map() };
  let fields = tableFields(state.table, alias, 'source');
  let rows = baseRows(state.table, alias);
  fields.forEach(f => res.known.set(f.id, f));
  res.st.source = { id: 'source', inFields: [], outFields: fields, rows, count: rows.length };

  let block = newBlock(`public.${state.table} ${alias}`, 'source', 1, false);
  let steps = 0;
  const rangeText = (a, z) => (a >= z ? `stage ${z}` : `stages ${a}–${z}`);
  const closeBlock = (n, reason) => {
    steps++;
    const name = `step_${steps}`;
    const names = outNames(fields, true);
    res.ctes.push({ name, lines: renderBlock(block, fields, names) });
    if (reason) res.notes.push({ stage: n, text: `Stage ${n}: ${reason}, so ${rangeText(block.start, n - 1)} run first as ${name}.` });
    fields = fields.map(f => ({ ...f, sql: qi(names.get(f.id)), out: names.get(f.id), agg: false, win: false, cte: name, renamed: false, selStage: null }));
    block = newBlock(name, null, n, true);
    return name;
  };

  state.stages.forEach((st, i) => {
    const n = i + 1;
    const info = { id: st.id, n, inFields: fields, inCount: rows.length };
    res.st[st.id] = info;
    const passThrough = extra => Object.assign(info, { outFields: fields, rows, count: rows.length }, extra);
    if (!st.enabled) return passThrough({ skipped: true });

    let F = new Map(fields.map(f => [f.id, f]));
    const missing = refsOf(st).filter(id => !F.has(id));
    if (missing.length) {
      const m = res.known.get(missing[0]);
      const label = m ? displayName(m) : missing[0].includes('.') ? missing[0] : 'A column this stage uses';
      return passThrough({ error: `${label} isn't available here. Move this stage below the one that provides it, or pick another column.` });
    }
    const inc = incompleteReason(st, F);
    if (inc) return passThrough({ incomplete: inc });

    if (st.type === 'sql') {
      const pristine = !block.touched && !block.fromCte;
      const prev = pristine ? `public.${state.table}` : closeBlock(n, null);
      steps++;
      const name = `step_${steps}`;
      res.ctes.push({ name, lines: st.sql.replace(/\bprev\b/g, prev).split('\n').map(t => ({ t, s: st.id })) });
      const names = outNames(fields, true);
      fields = fields.map(f => ({ ...f, sql: qi(names.get(f.id)), out: names.get(f.id), agg: false, win: false, cte: name, renamed: false, selStage: null }));
      block = newBlock(name, null, n + 1, true);
      return Object.assign(info, {
        inFields: fields, outFields: fields, rows, count: rows.length, clause: 'CTE', newStep: name,
        note: 'Previews can’t run custom SQL in this prototype, so rows pass through unchanged. The app would run it against the database and read the columns back.',
      });
    }

    const reason = breakReason(block, st, F);
    if (reason) {
      closeBlock(n, reason);
      info.newStep = `step_${steps}`;
      info.stepReason = reason;
    }
    if (st.type === 'join' && block.fromCte) {
      // Qualify CTE columns once a join brings in names that could clash.
      fields = fields.map(f => (f.cte === block.from && !f.sql.includes('.') ? { ...f, sql: `${block.from}.${f.sql}` } : f));
    }
    F = new Map(fields.map(f => [f.id, f]));
    info.inFields = fields;

    const r = evalStage(st, fields, rows, F);
    if (r.error) return passThrough({ error: r.error });
    info.clause = emitStage(block, st, F);
    fields = r.fields;
    rows = r.rows;
    fields.forEach(f => res.known.set(f.id, f));
    Object.assign(info, { outFields: fields, rows, count: rows.length, warn: r.warn, note: r.note, exprs: r.exprs });
  });

  res.final = { fields, rows };
  const lines = [];
  res.ctes.forEach((c, i) => {
    lines.push({ t: i === 0 ? `WITH ${c.name} AS (` : `), ${c.name} AS (`, s: null });
    c.lines.forEach(l => lines.push({ t: `  ${l.t}`, s: l.s }));
  });
  if (res.ctes.length) lines.push({ t: ')', s: null });
  lines.push(...renderBlock(block, fields, outNames(fields, false)));
  res.lines = lines;
  res.sql = lines.map(l => l.t).join('\n');
  return res;
}

function joinSuggestions(fields) {
  const out = [], seen = new Set();
  const push = s => {
    const k = `${s.table}|${s.l}|${s.r}`;
    if (!seen.has(k)) { seen.add(k); out.push(s); }
  };
  for (const f of fields) {
    if (f.fk) push({ table: f.fk[0], l: f.id, r: f.fk[1], card: 'Many-to-one', hint: displayName(f) });
    if (f.pk && f.table) {
      for (const t of TABLE_ORDER) {
        for (const c of TABLES[t].columns) {
          if (c.fk && c.fk[0] === f.table && c.fk[1] === f.name) push({ table: t, l: f.id, r: c.name, card: 'One-to-many', hint: `${t}.${c.name}` });
        }
      }
    }
  }
  return out;
}

const chev = icon('chev', 12);

function tokField(st, path, fid, opts = {}) {
  const f = fid ? lookupField(st, fid) : null;
  const cls = !fid ? 'tok tok-empty' : f ? 'tok' : 'tok tok-bad';
  const label = !fid ? esc(opts.placeholder || 'column') : f ? fieldHtml(f) : esc(fid);
  return `<button class="${cls}" data-act="pick-field" data-path="${path}" data-fid="${fid || ''}" data-kinds="${(opts.kinds || []).join(',')}" ${opts.optional ? 'data-optional="1"' : ''}><span class="tl">${label}</span>${chev}</button>`;
}
function choiceTok(path, value, choices, opts = {}) {
  const pairs = choices.map(c => (Array.isArray(c) ? c : [c, c]));
  const cur = pairs.find(([v]) => v === (value ?? ''));
  const enc = pairs.map(([v, l]) => `${v}:${l}`).join('|');
  return `<button class="tok tok-op" data-act="pick-choice" data-path="${path}" data-choices="${esc(enc)}" ${opts.free ? 'data-free="1"' : ''}>${esc(cur ? cur[1] : (value || opts.placeholder || 'choose'))}${chev}</button>`;
}
function delBtn(path, title = 'Remove') {
  return `<button class="ibtn xs del" data-act="del" data-path="${path}" title="${title}" aria-label="${title}">${icon('x', 12)}</button>`;
}
function segHtml(path, value, opts) {
  return `<div class="seg sm" role="group">${opts.map(([v, l]) => `<button data-act="set" data-path="${path}" data-value="${v}" aria-pressed="${v === value}">${l}</button>`).join('')}</div>`;
}

function valueHtml(f, o, c, p) {
  const v = c.value;
  switch (o.v) {
    case 'none': return '';
    case 'number': return `<input class="tin num" data-bind="${p}.value" value="${esc(v ?? '')}" placeholder="0" inputmode="decimal" aria-label="Value">`;
    case 'text': return `<input class="tin" data-bind="${p}.value" value="${esc(v ?? '')}" placeholder="value" aria-label="Value">`;
    case 'list': return `<input class="tin wide" data-bind="${p}.value" data-type="csv" value="${esc((v || []).join(', '))}" placeholder="a, b, c" aria-label="Values">`;
    case 'range':
      return `<input class="tin num" data-bind="${p}.value.a" value="${esc(v.a)}" placeholder="from" aria-label="From"><span class="kw">and</span><input class="tin num" data-bind="${p}.value.b" value="${esc(v.b)}" placeholder="to" aria-label="To">`;
    case 'enum': {
      const vals = v || [];
      return `<button class="tok ${vals.length ? '' : 'tok-empty'}" data-act="pick-enum" data-path="${p}"><span class="tl">${vals.length ? esc(vals.join(', ')) : 'choose values'}</span>${chev}</button>`;
    }
    case 'duration':
      return `<input class="tin xs" data-bind="${p}.value.n" data-type="num" value="${esc(v.n)}" aria-label="Amount">${choiceTok(`${p}.value.unit`, v.unit, ['days', 'weeks', 'months', 'years'])}`;
    case 'date': return `<input class="tin" type="date" data-bind="${p}.value" value="${esc(v || '')}" aria-label="Date">`;
    case 'daterange':
      return `<input class="tin" type="date" data-bind="${p}.value.a" value="${esc(v.a)}" aria-label="From"><span class="kw">and</span><input class="tin" type="date" data-bind="${p}.value.b" value="${esc(v.b)}" aria-label="To">`;
    case 'jsonkv':
      return `${choiceTok(`${p}.value.key`, v.key, f.keys || [], { free: true, placeholder: 'key' })}<span class="kw">=</span><input class="tin" data-bind="${p}.value.val" value="${esc(v.val)}" placeholder="value" aria-label="Value">`;
    case 'jsonkey': return choiceTok(`${p}.value`, v, f.keys || [], { free: true, placeholder: 'key' });
  }
  return '';
}

function condHtml(st, c, p) {
  const f = c.field ? lookupField(st, c.field) : null;
  const o = f ? opOf(f, c.op) : null;
  let h = tokField(st, `${p}.field`, c.field);
  if (f) h += `<button class="tok tok-op" data-act="pick-op" data-path="${p}">${esc(o ? o.label : 'operator')}${chev}</button>`;
  if (f && o) h += valueHtml(f, o, c, p);
  return h;
}

function groupRows(st, g, path, depth) {
  const rows = g.items.map((it, i) => {
    const p = `${path}.items.${i}`;
    const joiner = i === 0
      ? `<span class="joiner">${depth === 0 ? 'where' : ''}</span>`
      : `<button class="joiner" data-act="toggle-andor" data-path="${path}" title="Switch between and / or">${g.op}</button>`;
    let body;
    if (it.k === 'group') body = `<div class="fgroup nested">${groupRows(st, it, p, depth + 1)}</div>`;
    else if (it.k === 'raw') body = `<span class="chip mono">SQL</span><input class="tin sqlin" data-bind="${p}.sql" value="${esc(it.sql)}" placeholder="o.total_cents > 5000" spellcheck="false" aria-label="SQL condition">`;
    else body = condHtml(st, it, p);
    return `<div class="frow">${joiner}<div class="fbody">${body}</div>${delBtn(p)}</div>`;
  }).join('');
  const foot = `<div class="ffoot">
      <button class="btn xs ghost" data-act="add-cond" data-path="${path}">${icon('plus', 12)} Condition</button>
      ${depth === 0 ? `<button class="btn xs ghost" data-act="add-group" data-path="${path}">${icon('plus', 12)} Group</button>` : ''}
      <button class="btn xs ghost" data-act="add-raw" data-path="${path}">${icon('code', 12)} SQL</button>
    </div>`;
  return rows + foot;
}

function joinRelHint(st) {
  const p = st.on[0];
  const lf = p.l ? lookupField(st, p.l) : null;
  if (!lf || !st.table || !p.r) return '';
  if (lf.fk && lf.fk[0] === st.table && lf.fk[1] === p.r) return `Many-to-one via a foreign key. Each row matches at most one ${st.table} row.`;
  const rc = TABLES[st.table].columns.find(c => c.name === p.r);
  if (rc && rc.fk && rc.fk[0] === lf.table && rc.fk[1] === lf.name) return `One-to-many via a foreign key. A row can match several ${st.table} rows, so rows repeat.`;
  return 'No foreign key links these columns. Check the match is the one you want.';
}

function argHtml(st, c, a, p) {
  const v = c.args[a.k];
  const ap = `${p}.args.${a.k}`;
  const lab = a.label ? `<span class="kw">${a.label}</span>` : '';
  const suffix = a.suffix ? `<span class="kw">${a.suffix}</span>` : '';
  switch (a.t) {
    case 'field': case 'field?':
      return lab + tokField(st, ap, v, { kinds: a.kinds, optional: a.t === 'field?', placeholder: a.t === 'field?' ? 'all rows' : 'column' }) + suffix;
    case 'operand': {
      let label = 'column or value', cls = 'tok tok-empty', fid = '';
      if (v && v.f) {
        const f = lookupField(st, v.f);
        label = f ? fieldHtml(f) : esc(v.f); cls = f ? 'tok' : 'tok tok-bad'; fid = v.f;
      } else if (v) { label = esc(v.n != null ? String(v.n) : lit(v.s)); cls = 'tok'; }
      return `${lab}<button class="${cls}" data-act="pick-operand" data-path="${ap}" data-kinds="${(a.kinds || []).join(',')}" data-fid="${fid}"><span class="tl">${label}</span>${chev}</button>${suffix}`;
    }
    case 'choice': return lab + choiceTok(ap, v, a.choices) + suffix;
    case 'text': return `${lab}<input class="tin xs" data-bind="${ap}" value="${esc(v ?? '')}" aria-label="${a.label || a.k}">${suffix}`;
    case 'jsonkey': {
      const af = c.args.a ? lookupField(st, c.args.a) : null;
      return lab + choiceTok(ap, v, (af && af.keys) || [], { free: true, placeholder: 'key' });
    }
    case 'sql': return `<input class="tin sqlin" data-bind="${ap}" value="${esc(v ?? '')}" placeholder="coalesce(o.shipped_at, now()) - o.created_at" spellcheck="false" aria-label="SQL expression">`;
  }
  return '';
}

          <span class="kw">=</span>${tokField(st, 'on.0.l', p.l)}

        ...st.cols.map((c, idx) => ({ c, idx, f: inF.find(f => f.id === c.field), id: c.field })),

        </div>`).join('') + `<div><button class="btn xs ghost" data-act="add-sort">${icon('plus', 12)} Sort key</button></div>`;
    case 'limit':

  return '';

      <div class="ed">
        <p class="hint">This tab starts from <code>${state.table}</code>. Tables linked by a foreign key:</p>
        <div class="rel-list">${sugg.length ? sugg.map(s => `
          <button class="rel-btn" data-act="quick-join" data-value="${esc(JSON.stringify(s))}">${icon('link', 13)}<span class="rt">${s.table}</span><span class="rh">${s.card.toLowerCase()} · ${esc(s.hint)}</span><span class="ra">Join ${icon('plus', 12)}</span></button>`).join('') : '<p class="hint">None.</p>'}
        </div>
      </div>
      <div class="pv st-pv"></div>
    </div></div>
  </section>`;
}

function stageCardHtml(st, i) {
  const S = STAGES[st.type];
  return `
  <section class="st ${st.enabled ? '' : 'off'} ${st.collapsed ? 'collapsed' : ''}" data-stage="${st.id}">
    <header class="st-h">

      <span class="st-n">${i + 1}</span>

      <span class="st-title">${S.label}</span>
